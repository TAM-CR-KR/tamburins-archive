*{box-sizing:border-box;margin:0;padding:0}
:root{--sans:'Apple SD Gothic Neo','AppleSDGothicNeo','Malgun Gothic',-apple-system,sans-serif;--ink:#2b2824;--muted:#8a8177;--line:#e7e0d4;--bg:#ffffff;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.ttl{font-family:'TITLEFONT',serif;text-transform:uppercase;letter-spacing:.04em;}
.bar{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 16px;border-bottom:1px solid var(--line);}
.btn{font-family:var(--sans);font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink);}
.hero{text-align:center;padding:28px 20px 2px;}
.hero h1{font-size:23px;letter-spacing:.05em;}
.hero p{margin-top:7px;color:var(--muted);font-size:12.5px;}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 14px 4px;}
.tab{font-family:var(--sans);font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 15px;}
.wrap{max-width:1000px;margin:0 auto;padding:12px 16px 46px;}
.adesc{border-radius:14px;padding:15px 18px;margin:6px 0 14px;font-size:13px;line-height:1.7;}
.pfhd{font-family:'TITLEFONT',serif;text-transform:uppercase;font-size:11px;letter-spacing:.1em;color:var(--muted);margin:22px 0 10px;}
.toc{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.toc .row{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;cursor:pointer;border-bottom:1px solid var(--line);background:#fff;transition:.13s;}
.toc .row:last-child{border-bottom:0;}
.toc .row:hover{background:#faf7f1;}
.toc .row .nm{font-size:15px;font-weight:600;}
.toc .row .sub{font-size:11.5px;color:var(--muted);margin-top:3px;}
.toc .row .arw{font-size:16px;color:#c3b9a6;}
.toc .row .idx{font-family:'TITLEFONT',serif;font-size:12px;color:#c3b9a6;margin-right:12px;min-width:20px;}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;background:#fff;margin-bottom:14px;}
.detail{border:1px solid var(--line);border-radius:16px;background:#fff;padding:22px 22px;}
.detail .dtag{font-family:'TITLEFONT',serif;text-transform:uppercase;font-size:10px;letter-spacing:.12em;color:var(--muted);}
.detail h2{font-size:24px;margin:4px 0 4px;}
.detail .sub{font-size:13px;color:#5b5149;margin-top:5px;line-height:1.6;}
.dsec{margin-top:20px;}
.dsec h3{font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin-bottom:9px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:#efe9df;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;}
.chip.kw{background:#f3eef6;border-color:#e3d7ec;}
.word{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;background:#fbfaf7;}
.word .wl{font-size:11px;font-weight:700;color:#8a6d4a;margin-bottom:5px;}
.word .wt{font-size:13px;line-height:1.7;}
.word .wn{font-size:11.5px;color:var(--muted);margin-top:7px;}
.note{display:grid;grid-template-columns:64px 1fr;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;background:#fff;align-items:start;}
.note .np{font-size:10px;font-weight:700;color:#fff;background:#b7a892;border-radius:6px;padding:3px 0;text-align:center;}
.note .nm{font-weight:700;font-size:12.5px;}.note .ne{font-size:12px;color:#5b5149;line-height:1.6;margin-top:3px;}
.tip{border-radius:12px;padding:12px 15px;font-size:12.5px;line-height:1.65;background:#eef4e6;border:1px solid #d3e3bd;margin-top:8px;}
.tip b{display:block;font-size:11px;margin-bottom:4px;}

<script>
let GDATA=[{"id": "floral", "en": "Floral", "kr": "플로럴 — 꽃의 다양한 결", "c": {"bg": "#FBEAF0", "bd": "#F4C0D1", "tx": "#72243E", "ds": "#993556", "tabtx": "#72243E"}, "desc": "탬버린즈 플로럴은 화사하고 풍성한 꽃향이 아닌 절제되고 투명한 플로럴입니다. LALE의 그린-플로럴, EVENING GLOW의 따뜻한 플로럴, SUNSHINE의 복합 플로럴, SUMMER TAILS의 산뜻한 플로럴까지 각각 전혀 다른 결을 갖습니다.", "perfumes": [{"name": "LALE", "base": "LALE", "sub": "그린+플로럴 — 튤립 기반, 물기 있고 투명한 플로럴. 파우더리하지 않음", "respond": [{"label": "장면 워딩", "text": "덜 익은 풋사과를 베어 문 듯 푸릇하고 상큼한 향이 먼저 피어올라요. 이어서 물기 있는 화이트 튤립의 투명하고 여린 꽃향기가 번지고, 마지막엔 부드러운 샌달우드가 향을 은은하게 받쳐주며 파우더리하지 않은 맑은 여운을 남깁니다.", "note": "→ 그린 애플 탑, 튤립 하트, 샌달우드 베이스로만 구성했어요(파우더리하지 않게)."}, {"label": "전문 고객 워딩", "text": "탑은 그린 애플의 풋풋하고 새콤한 그린 노트로 열립니다. 하트는 화이트 튤립을 중심으로 헤디온과 PEA가 여리여리하고 투명한 그린-플로럴을 그려내며, 베이스의 샌달우드가 부드럽고 기름진 우디로 마무리해 물기 있는 플로럴의 결을 오래 유지합니다.", "note": "→ 탑은 베르가못이 아닌 그린 애플, 베이스는 화이트머스크가 아닌 샌달우드입니다."}], "plus": {"notes": [{"pos": "Top", "name": "그린 애플(Green Apple)", "everyday": "아직 덜 익은 풋사과를 한 입 베어 물 때 퍼지는 푸릇하고 새콤한 즙의 상쾌함이 떠오르는 순간이에요."}, {"pos": "Heart", "name": "화이트 튤립(White Tulip)", "everyday": "물기를 머금은 생화 튤립에 코를 가까이 댈 때 나는 투명하고 여린 꽃향기가 느껴지는 장면이에요."}, {"pos": "Base", "name": "샌달우드(Sandalwood)", "everyday": "부드럽고 기름진 백단향 나무가 은은하게 향을 받쳐주며 살결에 오래 남는 잔향이에요."}], "tip": "파우더리하고 무거운 꽃향을 부담스러워하시는 분께 권해보세요. 물기 있고 투명한 플로럴이라 봄여름에 특히 산뜻하게 즐기실 수 있다고 안내하시면 좋아요."}}, {"name": "EVENING GLOW", "base": "EVENING GLOW", "sub": "플로럴+머스크 — 노을빛 같은 따뜻하고 부드러운 플로럴", "respond": [{"label": "장면 워딩", "text": "첫인상은 딜 허브와 레몬처럼 프레시하고 상큼한 그린 시트러스로 열립니다. 이어 장미 꽃잎에 라즈베리 잼을 얹은 듯 우아하고 달콤한 플로럴이 화사하게 피어나고, 흙내음 감도는 사이프리올이 노을빛처럼 따뜻하고 깊게 마무리합니다.", "note": "→ 탑은 레몬·딜(피오니 아님), 베이스는 사이프리올"}, {"label": "전문 고객 워딩", "text": "탑의 레몬·딜(Lemon·Dill)이 시트러스 그린으로 산뜻하게 열고, 하트에서 로즈(Rose)의 우아함과 라즈베리(Raspberry)의 프루티 파우더리함이 어우러져 화사한 플로럴을 만듭니다. 베이스의 사이프리올(Cypriol)이 어스·아로마틱 우디로 받쳐 노을빛처럼 따뜻하고 깊은 플로럴 머스크 구조를 완성합니다.", "note": "→ 베이스는 사이프리올, 샌달우드·머스크 아님"}], "plus": {"notes": [{"pos": "Top", "name": "Lemon·Dill (레몬·딜)", "everyday": "요리에 딜 허브와 레몬을 곁들일 때 퍼지는, 프레시한 풀 향과 상큼한 시트러스가 산뜻하게 시작됩니다."}, {"pos": "Heart", "name": "Rose·Raspberry (로즈·라즈베리)", "everyday": "활짝 핀 장미 꽃잎의 우아한 향에 라즈베리 잼 같은 달콤함이 얹혀 부드럽고 화사하게 피어납니다."}, {"pos": "Base", "name": "Cypriol", "everyday": "흙내음이 감도는 강렬하고 아로마틱한 나무 향이 노을처럼 차분하고 깊게 잔향으로 남습니다."}], "tip": "'노을빛처럼 따뜻하고 부드러운 플로럴'이라는 콘셉트를 전하되, 시작은 레몬·딜로 상큼하다는 점을 짚어 주세요. 달콤한 플로럴을 좋아하면서 흙내음의 깊이를 원하는 고객께 특히 잘 맞습니다."}}, {"name": "SUNSHINE", "base": "SUNSHINE", "sub": "플로럴+우디+머스크 — 햇살 아래 피어나는 복합 플로럴, 우디 베이스로 지속력 ↑", "respond": [{"label": "장면 워딩", "text": "햇살 좋은 바닷가의 맑은 미네랄 향과 은은한 짭짤함, 상쾌한 그린으로 산뜻하게 열려요. 곧 은방울꽃의 맑고 달콤한 꽃향이 중심을 채우고, 마지막엔 부드럽게 스모키한 가이악 우드가 따뜻하게 잔향을 이어 줍니다.", "note": "→ 짭짤한 미네랄로 열려 은방울꽃을 지나 따뜻한 우디로 정착"}, {"label": "전문 고객 워딩", "text": "솔티 미네랄의 맑은 공기감과 안젤리카의 스파이시한 그린이 햇살 아래 피어나는 톱을 만듭니다. 하트에서는 뮤게(은방울꽃)의 맑고 깨끗한 화이트 플로럴이 중심을 이루고, 베이스의 가이악 우드가 머스크·바닐라를 닮은 부드러운 우디로 지속력을 높여 줍니다.", "note": "→ 솔티 미네랄·안젤리카 → 뮤게 → 가이악 우드"}], "plus": {"notes": [{"pos": "Top", "name": "솔티 미네랄(Salty Mineral)·안젤리카(Angelica)", "everyday": "햇살 좋은 날 바닷가에 앉아 있을 때 공기 중에 퍼지는 맑은 미네랄 향과 피부에 남는 은은한 짭짤함에, 상쾌하고 스파이시한 안젤리카 그린이 더해지는 첫인상이에요."}, {"pos": "Heart", "name": "뮤게(Muguet, 은방울꽃)", "everyday": "봄날 화병에 꽂아 둔 은방울꽃 곁을 지날 때, 맑고 깨끗하면서도 은은하게 달콤한 꽃향이 피어오르는 순간이에요."}, {"pos": "Base", "name": "가이악 우드(Guaiac Wood)", "everyday": "따뜻한 나무 온기가 도는 공간에서, 무겁지 않게 스모키하면서 바닐라 같은 부드러움이 감도는 우디향이 오래 머무는 잔향이에요."}], "tip": "플로럴에 우디 베이스가 받쳐 지속력이 좋은 편이에요. 은방울꽃의 맑은 인상을 살리려면 처음엔 향이 가볍게 느껴질 수 있으니, 시간이 지날수록 가이악 우드로 따뜻하게 깊어진다고 함께 안내해 주세요."}}, {"name": "SUMMER TAILS", "base": "SUMMER TAILS", "sub": "그린+플로럴 — 여름 끝 산뜻하고 시원한 플로럴", "respond": [{"label": "장면 워딩", "text": "감초처럼 달콤하고 살짝 알싸한 아니스에 상쾌한 시트러스와 그린이 더해져 산뜻하게 열려요. 곧 제라늄과 장미를 중심으로 한 투명한 그린 플로럴이 우아하게 피어나고, 마지막엔 머스크 위로 시더우드와 패츌리가 깊어지는 세련된 레더리 우드 잔향이 남습니다.", "note": "→ 알싸한 아니스로 열려 그린 플로럴을 지나 레더리 우드로 정착"}, {"label": "전문 고객 워딩", "text": "아니스의 달콤·스파이시한 톱이 시트러스·그린과 어우러져 여름 끝의 산뜻한 첫인상을 만듭니다. 하트에서는 제라늄과 로즈를 중심으로 한 그린 화이트 플로럴이 은방울꽃 같은 투명함을 더하고, 베이스에서는 머스크를 바탕으로 시더우드와 패츌리가 세련된 레더리 우드 톤의 잔향을 완성합니다.", "note": "→ 아니스 → 제라늄·로즈 화이트 플로럴 → 시더우드·패츌리 레더리 우드"}], "plus": {"notes": [{"pos": "Top", "name": "아니스(Anise)", "everyday": "감초처럼 달콤하면서 살짝 알싸한 향에 상쾌한 시트러스와 그린이 더해져, 뜨거웠던 여름의 아스라한 열기가 스치는 밝은 첫인상이에요."}, {"pos": "Heart", "name": "그린을 더한 화이트 플로럴(제라늄·로즈)", "everyday": "막 손질한 제라늄과 장미가 어우러진 화단 곁을 지날 때, 은방울꽃처럼 투명하고 깨끗한 그린 플로럴이 우아하게 피어오르는 순간이에요."}, {"pos": "Base", "name": "레더리 우드(시더우드·패츌리)", "everyday": "부드러운 가죽 소파에 기대앉았을 때처럼, 머스크의 포근함 위로 시더우드와 패츌리가 깊이를 더한 세련된 레더리 우드 잔향이에요."}], "tip": "그린-플로럴에 레더리 우드가 받쳐 여름 끝 시원함과 세련된 깊이를 함께 지녔어요. 산뜻한 플로럴을 찾으시는 분께 제라늄·로즈의 투명한 그린감과 시더우드로 정돈되는 잔향의 균형을 함께 소개해 주세요."}}], "approach": [{"title": "취향 세분화 질문", "text": "'꽃향 좋아하세요?'에서 더 나아가 — '화사하고 풍성한 플로럴인지, 아니면 물기 있고 투명한 쪽인지, 따뜻하게 감기는 플로럴인지' 방향을 좁혀가기."}, {"title": "감각 표현법", "text": "'봄날 꽃다발'보다 '이슬이 맺힌 튤립 한 송이', '노을 질 무렵 창가에 놓인 꽃병'처럼 장면과 빛으로 묘사."}], "scripts": [{"who": "고객", "line": "꽃향 좋아하는데 너무 달콤하거나 진하지 않은 거 찾아요."}, {"who": "직원", "line": "그러시면 LALE가 정말 잘 맞으실 것 같아요. 탬버린즈 플로럴 중에서 가장 투명하고 물기 있는 타입인데요, 튤립에서 영감을 받아서 달콤하거나 파우더리하지 않고 그린이 섞인 맑은 플로럴이에요. 비교해서 EVENING GLOW도 맡아보시면 좋은데, 이건 좀 더 따뜻하게 감기는 플로럴이에요.", "note": "→ 고객의 부정어(달콤하지 않은, 진하지 않은)를 정확히 LALE에 연결"}, {"who": "직원 (연계)", "line": "SUNSHINE은 플로럴이면서 우디 베이스가 있어서 지속력이 더 긴 편이에요. 오래 지속되는 플로럴을 원하신다면 이쪽도 한번 비교해보시겠어요?", "note": "→ 지속력 니즈가 있을 때 SUNSHINE으로 자연스러운 확장"}], "upsell": ["LALE → 같은 그린-플로럴 계열 핸드크림으로 레이어링 제안", "EVENING GLOW → 선물용 패키지 추천 자연스럽게 연결"], "caution": {"no": "'가장 여성스러운 향이에요'", "yes": "'섬세하고 절제된 분위기를 좋아하시는 분들한테 반응이 좋아요'"}}, {"id": "herbal", "en": "Herbal · Green · Mossy", "kr": "허벌/그린/모시 — 자연의 날 것", "c": {"bg": "#EAF3DE", "bd": "#C0DD97", "tx": "#3B6D11", "ds": "#639922", "tabtx": "#3B6D11"}, "desc": "Herbal(CHAMO, PUPPY), Green(LALE, LATE AUTUMN, SUMMER TAILS), Mossy(BATHER IN THE LAKE)로 세분화됩니다. 허브의 자극적인 날 것, 풀밭의 청초함, 물가 이끼의 습윤함으로 각각 다른 자연의 감각입니다.", "perfumes": [{"name": "CHAMO", "base": "CHAMO", "sub": "허벌+머스크 — 카모마일 허브가 베이스, 따뜻하고 자연스러운 허벌 스킨향", "respond": [{"label": "장면 워딩", "text": "처음엔 따뜻한 카모마일 차에 클라리 세이지 허브를 곁들인 듯 달콤하면서도 씁쓸한 향이 감돌아요. 이어서 비에 젖은 흙과 서늘한 물의 기운이 향을 차분하게 가라앉히고, 마지막엔 잘 정돈된 원목의 포근한 온기가 살결처럼 남습니다.", "note": "→ 탑의 허벌 감성에서 워터, 우디 드라이다운으로 자연스럽게 이어지도록 구성했어요."}, {"label": "전문 고객 워딩", "text": "탑은 카모마일과 클라리 세이지의 허벌 어코드로 열려, 꿀 같은 단맛과 씁쓸함이 공존합니다. 하트에서 사이프리올의 어시하고 아로마틱한 우디함과 칼론 계열 워터 노트가 균형을 잡아주고, 베이스는 캐시메란과 앰버 계열이 어우러진 블론드 우드로 머스키하고 따뜻하게 마무리됩니다.", "note": "→ 실제 원료(카모마일/클라리세이지·사이프리올/워터·블론드우드)만 사용했습니다."}], "plus": {"notes": [{"pos": "Top", "name": "카모마일(Chamomile) / 클라리 세이지(Clary sage)", "everyday": "따뜻한 카모마일 티백을 우릴 때 꿀처럼 은은히 달다가 살짝 씁쓸하게 번지는, 편안한 허브 향이 떠오르는 순간이에요."}, {"pos": "Heart", "name": "사이프리올(Cypriol) / 워터 노트(Water)", "everyday": "비 갠 뒤 젖은 흙과 나무 결에서 올라오는 서늘하고 촉촉한 공기가 느껴지는 장면이에요."}, {"pos": "Base", "name": "블론드 우드(Blond wood) — 캐시메란/앰버", "everyday": "막 정돈한 원목 가구를 손으로 쓸어내릴 때 느껴지는 깨끗하고 포근한 나무의 잔향이에요."}], "tip": "허브차를 즐기시는 분이나 자연스럽고 편안한 스킨 향을 찾으시는 분께 권해보세요. 손목에 뿌린 뒤 시간이 지나면 포근한 우디 잔향이 살결처럼 남는다고 안내하시면 좋아요."}}, {"name": "LATE AUTUMN", "base": "LATE AUTUMN", "sub": "그린+머스크 — 가을 숲 바닥의 건조한 그린, 드라이하고 잔잔한", "respond": [{"label": "장면 워딩", "text": "낙엽을 밟다 잎을 짓이긴 듯 푸릇하고 화한 그린으로 시작합니다. 사탕수수의 자연스러운 단맛과 쓴쑥의 묵직함이 어우러져 가을의 깊이를 더하고, 촉촉한 숲의 시더우드가 드라이하게 잔잔히 남습니다.", "note": "→ 부쿠·쓴쑥·시더우드 (베티버·앰브레트 아님)"}, {"label": "전문 고객 워딩", "text": "탑의 부쿠(Buchu)가 민트 뉘앙스의 푸른 그린을 열고, 하트에서 사탕수수(Sugarcane)의 은은한 단맛과 쓴쑥(Worm wood)의 진득함이 대비를 이룹니다. 베이스의 시더우드(Cedar wood)가 촉촉한 우디로 받쳐 가을 숲 바닥 같은 드라이 그린 머스크 구조를 완성합니다.", "note": "→ 사탕수수의 단맛은 자연스러운 톤, 무겁지 않게 안내"}], "plus": {"notes": [{"pos": "Top", "name": "Buchu", "everyday": "나뭇잎을 손으로 짓이겼을 때 퍼지는 푸릇한 풀 향에, 박하처럼 화하고 허브 같은 뉘앙스가 산뜻하게 열립니다."}, {"pos": "Heart", "name": "Sugarcane·Worm wood (사탕수수·쓴쑥)", "everyday": "사탕수수 즙처럼 인공적이지 않은 은은한 단맛에, 쓴쑥의 진득하고 묵직한 허브 향이 겹쳐 깊어집니다."}, {"pos": "Base", "name": "Cedar wood", "everyday": "촉촉한 숲속을 걸을 때 나는 상쾌하면서도 그윽한 나무 향이 차분하게 마무리해 줍니다."}], "tip": "'가을 숲 바닥의 건조하고 잔잔한 그린'이라는 콘셉트를 그대로 전해 주세요. 쓴쑥의 묵직함 덕에 무게감이 있으니, 진한 향을 선호하는 고객께 특히 잘 맞습니다."}}, {"name": "BATHER IN THE LAKE", "base": "BATHER IN THE LAKE", "sub": "모시+머스크 — 호수가 이끼, 습윤하고 물기 있는 자연", "respond": [{"label": "장면 워딩", "text": "첫 향은 허브 잎을 매만진 듯 맑고 파우더리한 클라리 세이지로 열립니다. 이어 갓 뜯은 쑥처럼 쌉싸름하고 싱그러운 향이 톡 쏘게 번지고, 마지막엔 비 온 뒤 이끼 낀 숲 바닥처럼 촉촉한 잔향이 남습니다.", "note": "→ 탑은 클라리 세이지(아쿠아틱 아님), 이끼는 베이스"}, {"label": "전문 고객 워딩", "text": "탑의 클라리 세이지(Clary sage)가 아로마틱한 허벌 인상을 열고, 하트의 쑥(Artemisia)이 쌉싸름함과 스파이시함으로 자연스러운 그린을 이어줍니다. 베이스의 모스(Moss)가 습윤한 어스 톤으로 마무리해 호숫가의 물기 어린 자연을 그리는 허벌 머스크 구조입니다.", "note": "→ 물 노트가 아니라 이끼·쑥의 습윤한 그린 허벌"}], "plus": {"notes": [{"pos": "Top", "name": "Clary sage", "everyday": "허브 화분 잎을 손끝으로 매만질 때 나는, 라벤더보다 덜 달고 파우더리하면서도 아로마틱한 허브 향이 맑게 시작됩니다."}, {"pos": "Heart", "name": "Artemisia (쑥)", "everyday": "들에서 갓 뜯은 쑥을 손으로 비볐을 때처럼 쌉싸름하고 싱그러운 허브 향에 톡 쏘는 스파이시함이 감돕니다."}, {"pos": "Base", "name": "Moss", "everyday": "비 온 뒤 나무뿌리 근처 이끼를 밟았을 때 올라오는 촉촉하고 물기 어린 자연의 향이 차분하게 깔립니다."}], "tip": "'물향'을 기대하는 고객께는 아쿠아틱 계열이 아니라 '호숫가 풀숲과 이끼의 촉촉함을 허브로 그린 향'이라고 설명해 주세요. 자연스럽고 튀지 않아 데일리로 부담 없이 권하기 좋습니다."}}, {"name": "PUPPY", "base": "PUPPY", "sub": "너티+허벌 — 허브가 포근하고 달콤한 너티와 결합, 피부에 가까운 자연향", "respond": [{"label": "장면 워딩", "text": "창을 활짝 연 아침 공기처럼 투명하고 반짝이는 알데하이드로 산뜻하게 열려요. 곧 신선한 사과 같은 블루 카모마일의 달콤한 허브향이 감싸고, 마지막엔 강아지 발에서 나는 듯한 고소하고 포근한 너티 우드 잔향이 피부 가까이 남습니다.", "note": "→ 투명한 알데하이드로 열려 카모마일을 지나 포근한 포 어코드로 마무리"}, {"label": "전문 고객 워딩", "text": "루미너스 알데하이드가 확 퍼지는 투명하고 스파클링한 톱을 만듭니다. 하트에서는 아줄렌을 머금은 블루 카모마일이 사과 같은 과일 언더톤과 달콤한 허브 향을 더하고, 베이스의 시그니처 포 어코드가 강아지의 숨결을 닮은 너티한 우드로 피부에 가까운 자연향을 완성합니다.", "note": "→ 알데하이드 → 블루 카모마일 → 포 어코드(너티 우드)"}], "plus": {"notes": [{"pos": "Top", "name": "루미너스 알데하이드(Aldehydes)", "everyday": "창문을 활짝 연 아침, 투명하고 반짝이는 공기가 확 퍼지듯 향이 밝고 산뜻하게 열리는 첫 순간이에요."}, {"pos": "Heart", "name": "블루 카모마일(Blue Chamomile)", "everyday": "따뜻한 카모마일 티를 우릴 때 올라오는, 신선한 사과 같은 과일향과 달콤한 허브향이 포근하게 감도는 순간이에요."}, {"pos": "Base", "name": "포 어코드(Paw accord, 강아지 발·너티 우드)", "everyday": "품에 안긴 강아지의 따뜻한 숨결에서 느껴지는 고소한 시리얼 향과 보드라운 털의 촉감이 떠오르는, 너티한 우드 잔향이에요."}], "tip": "강아지 발을 닮은 포 어코드가 이 향의 시그니처예요. 피부에 가까운 너티·허벌 무드라 은은하게 퍼지니, 반려동물이나 포근한 향을 좋아하시는 분께 체온으로 은은하게 피어나는 매력을 강조해 주세요."}}, {"name": "SUMMER TAILS", "base": "SUMMER TAILS", "sub": "그린+플로럴 — 여름 끝 풀밭의 산뜻한 그린", "respond": [], "plus": {"notes": [], "tip": ""}}], "approach": [{"title": "취향 세분화 질문", "text": "'자연스러운 향 좋아하세요?'에서 더 구체화. '숲 속 나무인지, 풀밭인지, 물가 이끼인지, 허브처럼 약간 자극적인 그린인지'로 방향 좁히기."}, {"title": "감각 표현법", "text": "'삼림욕', '비 온 직후 흙과 풀 냄새', '약초를 비볐을 때의 자극감', '호수가 산책로' 같이 공간과 장면으로 표현."}], "scripts": [{"who": "고객", "line": "인공적인 향이 싫고 자연에서 나는 것 같은 향 찾아요."}, {"who": "직원", "line": "그러시면 계열이 조금 나뉘는데요, 어떤 자연이냐에 따라 달라요. 풀밭이나 숲 느낌을 좋아하시면 LATE AUTUMN이나 LALE가 잘 맞으시고, 물가나 습한 이끼 느낌이면 BATHER IN THE LAKE가 딱이에요. CHAMO는 카모마일 허브 베이스라서 좀 더 따뜻하고 포근한 자연향이고요. 어떤 쪽이 더 당기세요?", "note": "→ '자연' 안에서도 세 가지 방향으로 안내, 고객이 선택하도록"}, {"who": "직원 (그린 선택 시)", "line": "LATE AUTUMN은 처음엔 그린이 드라이하게 오다가, 뒤로 갈수록 아주 얇은 머스크가 올라오면서 피부에 밀착돼요. 가을 낙엽 밟는 그 건조하고 차분한 느낌이에요.", "note": "→ 드라이다운 변화를 계절 장면으로 표현"}], "upsell": ["CHAMO → 카모마일 계열 바디워시로 레이어링 제안", "BATHER IN THE LAKE → 독특한 취향 고객에게 LATE AUTUMN과 분위기 비교 제안"], "caution": {"no": "'남성적인 자연향이에요'", "yes": "'꾸밈없고 자연스러운 향을 선호하시는 분들한테 잘 맞는 계열이에요'"}}, {"id": "fruity", "en": "Fruity", "kr": "프루티/티 — 달콤하되 다층적으로", "c": {"bg": "#FAECE7", "bd": "#F5C4B3", "tx": "#712B13", "ds": "#993C1D", "tabtx": "#712B13"}, "desc": "PUMKINI(Fruity+Musk)와 WHITE DARJEELING(Fruity+Tea)은 같은 프루티지만 전혀 다른 결입니다. PUMKINI는 달콤하고 포근한 과일, WHITE DARJEELING은 홍차가 프루티를 클린하게 감싸는 구조입니다. 이 차이를 정확히 설명할 수 있어야 합니다.", "perfumes": [{"name": "PUMKINI", "base": "PUMKINI", "sub": "프루티+머스크 — 무화과+달콤함, 포근하고 여운이 긴 스위트 프루티", "respond": [{"label": "장면 워딩", "text": "처음엔 차조기 잎을 손으로 스친 듯 프레시한 그린이 산뜻하게 열립니다. 이내 뭉근히 졸인 호박의 달큰함에 생강의 톡 쏘는 스파이시함이 얹혀 포근해지고, 마무리엔 데운 코코넛 밀크처럼 부드럽고 크리미한 잔향이 오래 남습니다.", "note": "→ 호박이 주인공인 스위트 프루티, 무화과·블랙커런트 아님"}, {"label": "전문 고객 워딩", "text": "탑의 차조기잎(Perilla leaf)이 진한 그린으로 문을 열고, 하트에서 호박(Pumpkin)의 달콤함과 생강(Ginger)의 스파이시함이 대비를 이루며 온기를 만듭니다. 베이스의 코코넛 밀크(Coconut milk)가 전체를 크리미하게 감싸 여운이 길고 포근한 스위트 프루티 구조로 완성됩니다.", "note": "→ 호박·생강 중심 구성, 머스크형 클린향으로 오해 주의"}], "plus": {"notes": [{"pos": "Top", "name": "Perilla leaf (차조기잎)", "everyday": "김밥이나 쌈 채소를 다듬을 때 차조기 잎을 손으로 스치면 퍼지는, 프레시하면서도 진한 초록 풀 향이 첫인상을 열어줍니다."}, {"pos": "Heart", "name": "Pumpkin·Ginger (호박·생강)", "everyday": "가을에 잘 익은 호박을 뭉근하게 졸일 때 나는 달콤하고 진득한 향에, 생강청을 한 스푼 넣은 듯 톡 쏘는 스파이시함이 살짝 겹쳐집니다."}, {"pos": "Base", "name": "Coconut milk", "everyday": "따뜻한 코코넛 밀크를 한 컵 데워 마실 때처럼 부드럽고 크리미한 잔향이 피부에 포근하게 남습니다."}], "tip": "단 향을 부담스러워하는 고객께는 '설탕 단내가 아니라 호박을 졸인 자연스러운 단맛에 생강이 잡아주는 향'이라고 안내하면 이해가 빠릅니다. 손목보다 옷깃 안쪽에 살짝 뿌리면 코코넛 밀크 잔향이 은은하게 오래 남습니다."}}, {"name": "WHITE DARJEELING", "base": "WHITE DARJEELING", "sub": "프루티+티 — 홍차가 프루티를 감싸는 클린하고 세련된 구조", "respond": [{"label": "장면 워딩", "text": "화이트 스파클링 와인처럼 톡톡 튀는 탄산과 청포도의 상큼함이 먼저 피어올라요. 이어서 다즐링 홍차의 씁쓸하고 은근한 찻잎 향이 그 위를 감싸고, 마지막엔 머스크가 살결 같은 따뜻함과 파우더리한 부드러움으로 감싸며 클린하게 마무리됩니다.", "note": "→ 홍차가 프루티를 감싸는 구조를 탑→하트→베이스 드라이다운으로 살렸어요."}, {"label": "전문 고객 워딩", "text": "탑은 화이트 샴페인 어코드로, 리날릴 아세테이트와 비터 오렌지가 시고 톡톡 튀는 탄산감과 청포도의 단맛을 그려냅니다. 하트는 블랙 티(다즐링) 노트에 시더우드 아틀라스와 베타-이오논이 더해져 씁쓸하고 진한 홍차의 결을 표현하고, 베이스의 머스크가 따뜻하고 파우더리한 애니멀릭 감으로 세련되게 마무리합니다.", "note": "→ 노트로우의 화이트샴페인·블랙티·머스크 구조만 사용했습니다."}], "plus": {"notes": [{"pos": "Top", "name": "화이트 샴페인(White Champagne)", "everyday": "차가운 화이트 스파클링 와인을 따를 때 톡톡 튀는 탄산과 청포도의 새콤달콤한 향이 올라오는 순간이에요."}, {"pos": "Heart", "name": "블랙 티(Black Tea / Darjeeling)", "everyday": "따뜻한 다즐링 홍차를 우릴 때 은근하게 풍겨오는 씁쓸하고 진한 찻잎 향이 감도는 장면이에요."}, {"pos": "Base", "name": "머스크(Musk)", "everyday": "갓 말린 포근한 이불에 얼굴을 묻을 때 느껴지는, 살결처럼 부드럽고 파우더리한 따뜻함이에요."}], "tip": "홍차를 좋아하시는 분께 특히 잘 어울린다고 안내해 주세요. 시작은 스파클링하게 상큼하지만 시간이 지나면 홍차와 머스크의 클린하고 세련된 잔향이 오래 남는다고 설명하시면 좋아요."}}], "approach": [{"title": "취향 세분화 질문", "text": "'달콤한 향 좋아하세요?'에서 더 나아가 — '과즙이 터지는 신선한 달콤함인지, 무화과처럼 포근한 달콤함인지, 홍차처럼 클린한 달콤함인지' 방향 좁히기."}, {"title": "감각 표현법", "text": "'과일향이에요'가 아니라 '냉장고에서 꺼낸 복숭아의 서늘하고 달콤한 향기', '오후에 마시는 얼그레이 한 잔의 여운'처럼 일상 장면으로."}], "scripts": [{"who": "고객", "line": "달달하면서도 너무 무겁지 않은 향 있을까요?"}, {"who": "직원", "line": "두 가지를 비교해보시면 좋을 것 같아요. WHITE DARJEELING은 프루티한데 홍차 베이스가 있어서 달콤하면서도 굉장히 클린하게 느껴지거든요. 무겁지 않은 달콤함을 원하시면 이게 딱 맞을 것 같고요. PUMKINI는 좀 더 포근하고 따뜻하게 감기는 달콤함이에요. 어떤 게 더 당기시나요?", "note": "→ 두 프루티의 결 차이(클린 vs 포근)를 명확히 대비"}, {"who": "직원 (WHITE DARJEELING 시향 후)", "line": 으로 열려 편백을 지나 잔잔한 우디로 마무리"}, {"label": "전문 고객 워딩", "text": "파인 오일의 시원한 잎사귀 향과 히비스커스의 상큼한 과일 뉘앙스가 가장 가벼운 그린-우디 톱을 만듭니다. 피톤치드를 머금은 편백(히노키)이 프레시하고 맑은 하트를 이루고, 베이스에서는 드리프트우드의 고급스러운 우디와 올리바넘 레지노이드의 수지 톤이 차분한 깊이를 더합니다.", "note": "→ 파인·히비스커스 → 편백 → 드리프트우드·올리바넘"}], "plus": {"notes": [{"pos": "Top", "name": "파인 오일(Pine oil)·히비스커스(Hibiscus)", "everyday": "숲길에서 솔방울을 만지고 난 손끝의 상쾌한 나무향에, 히비스커스 티 한 잔의 톡 쏘는 상큼한 과일향이 살짝 곁들여지는 첫인상이에요."}, {"pos": "Heart", "name": "편백나무(Hinoki)", "everyday": "편백 숲 한가운데 서서 크게 숨을 들이쉴 때, 맑고 신비로운 그린 우디향이 폐 안 가득 차오르는 그 순간이에요."}, {"pos": "Base", "name": "드리프트우드(Driftwood)·올리바넘 레지노이드(Olibanum resinoid)", "everyday": "해변 휴양지에서 오래 마른 유목을 만졌을 때의 고급스러운 우디향에, 나무 수액이 굳은 듯한 은은한 수지향이 차분하게 내려앉는 잔향이에요."}], "tip": "가장 가벼운 그린-우디 계열이라 오피스나 한여름에도 부담이 없어요. 편백 향을 좋아하시는 분께는 옷깃보다 손목에 가볍게 두어 번 뿌려 프레시함이 오래 이어지도록 권해 주세요."}}, {"name": "BOTTARI", "base": "BOTTARI", "sub": "앰버+머스크 — 따뜻한 앰버가 머스크와 결합, 포근하고 관능적", "respond": [{"label": "장면 워딩", "text": "원목 향이 은은하게 감도는 서재에 들어선 것처럼 부드러운 우디 노트로 시작해요. 곧 비 온 뒤 이끼와 흙의 촉촉함, 포근한 사향의 온기가 감싸 안고, 마지막엔 바다를 오래 머금은 듯한 따뜻한 잔향이 살결에 남습니다.", "note": "→ 우디로 열려 흙·사향을 지나 포근한 잔향으로 정착"}, {"label": "전문 고객 워딩", "text": "탬버린즈 전용 베이스로 디벨롭한 아키갈라 우드가 페퍼리함을 덜어낸 부드러운 우디 톱으로 문을 엽니다. 하트에서는 사향을 지닌 암브레트와 젖은 흙내음의 모스가 어우러지고, 베이스의 용연향(앰버그리스)이 은은한 흙빛 온기로 관능적인 앰버-머스크 잔향을 완성합니다.", "note": "→ 아키갈라 우드 → 암브레트·모스 → 용연향 드라이다운"}], "plus": {"notes": [{"pos": "Top", "name": "아키갈라 우드(Akigala wood)", "everyday": "묵직한 원목 가구가 놓인 서재에 들어섰을 때, 매콤함은 살짝 가라앉고 부드럽고 고급스러운 우디향만 은은하게 감도는 느낌이에요."}, {"pos": "Heart", "name": "암브레트(Ambrette)·모스(Moss)", "everyday": "비 온 뒤 이끼 낀 돌담을 지날 때 촉촉한 흙내음이 올라오고, 그 위로 씨앗에서 나는 포근한 사향 같은 온기가 겹쳐지는 순간이에요."}, {"pos": "Base", "name": "용연향(Ambergris)", "everyday": "바닷바람을 오래 머금은 스카프를 목에 둘렀을 때처럼, 은은한 흙내음이 살결에 남아 오래도록 따뜻하게 이어지는 잔향이에요."}], "tip": "묵직한 우디와 용연향은 체온에 반응해 깊어지니, 손목이나 목덜미 등 맥박이 뛰는 곳에 뿌리시면 시간이 지날수록 포근한 앰버-머스크 잔향이 살아난다고 안내해 주세요."}}, {"name": "SUNSHINE", "base": "SUNSHINE", "sub": "플로럴+우디+머스크 — 플로럴을 우디가 잡아주는 지속형 구조", "respond": [], "plus": {"notes": [], "tip": ""}}], "approach": [{"title": "무게감 스펙트럼 안내", "text": "우디 계열 안에서도 가벼운 순서로 안내: BLUE HINOKI(그린-우디) → BERGA SANDAL(시트러스-우디) → BROWN(앰버-우디) → UNKNOWN OUD(발사믹-우디) 순으로 스펙트럼 제시."}, {"title": "감각 표현법", "text": "'나무 향이에요'보다 '비 오기 직전 마른 땅', '오래된 서재 나무 책장', '깊은 숲 속 이른 아침 안개 사이 나무', '캐러멜을 입힌 나무 내부' 같은 장면으로."}], "scripts": [{"who": "고객", "line": "우디한 향 찾는데 얼마나 다양한지 모르겠어요."}, {"who": "직원", "line": "우디 계열이 탬버린즈 안에서 굉장히 다양하거든요. 제일 가벼운 건 BLUE HINOKI인데 편백나무 기반이라 그린이랑 우디가 섞여서 삼림욕 같은 느낌이고요, 좀 더 클래식하게 우디를 원하시면 BERGA SANDAL이 베르가못+샌달우드 조합이에요. 묵직하고 깊게 가고 싶다면 UNKNOWN OUD가 수지+우디라서 가장 강한 인상을 줘요. 어떤 방향이 더 맞으세요?", "note": "→ 가벼운 → 무거운 스펙트럼으로 3단계 안내"}, {"who": "직원 (UNKNOWN OUD 전문 고객에게)", "line": "UNKNOWN OUD는 발사믹 계열이 베이스에 있어서 드라이다운이 굉장히 수지 같고 깊어요. 이 쪽 계열 좋아하시는 분들은 한번 경험하면 계속 찾으시더라고요.", "note": "→ 발사믹 용어 자연스럽게 사용, 전문 고객 신뢰 획득"}], "upsell": ["BERGA SANDAL → 재방문 고객에게 UNKNOWN OUD로 더 깊은 우디 경험 제안", "BROWN → 앰버+우디 좋아하는 고객에게 BOTTARI로 머스크 레이어 추가 제안"], "caution": {"no": "'남성분들이 많이 찾는 향이에요'", "yes": "'절제되고 묵직한 감도를 좋아하시는 분들한테 잘 맞는 계열이에요'"}}, {"id": "musk", "en": "Musk", "kr": "머스크 — 피부와 가장 가까운 향", "c": {"bg": "#EEEDFE", "bd": "#CECBF6", "tx": "#3C3489", "ds": "#534AB7", "tabtx": "#3C3489"}, "desc": "머스크는 탬버린즈에서 단독 메인보다 서포팅 노트로 가장 많이 등장합니다. CHAMO, PUMKINI, LATE AUTUMN, BATHER IN THE LAKE, EVENING GLOW, BOTTARI, SUNSHINE이 모두 머스크를 포함합니다. 고객이 '머스크 좋아한다'고 할 때, 어떤 계열의 머스크인지 함께 파악하는 것이 핵심입니다.", "perfumes": [{"name": "CHAMO (머스크 관점)", "base": "CHAMO", "sub": "허벌+머스크 — 카모마일 허브 위에 따뜻한 머스크, 피부 밀착형", "respond": [{"label": "장면 워딩", "text": "처음엔 따뜻한 카모마일 차에 클라리 세이지 허브를 곁들인 듯 달콤하면서도 씁쓸한 향이 감돌아요. 이어서 비에 젖은 흙과 서늘한 물의 기운이 향을 차분하게 가라앉히고, 마지막엔 잘 정돈된 원목의 포근한 온기가 살결처럼 남습니다.", "note": "→ 탑의 허벌 감성에서 워터, 우디 드라이다운으로 자연스럽게 이어지도록 구성했어요."}, {"label": "전문 고객 워딩", "text": "탑은 카모마일과 클라리 세이지의 허벌 어코드로 열려, 꿀 같은 단맛과 씁쓸함이 공존합니다. 하트에서 사이프리올의 어시하고 아로마틱한 우디함과 칼론 계열 워터 노트가 균형을 잡아주고, 베이스는 캐시메란과 앰버 계열이 어우러진 블론드 우드로 머스키하고 따뜻하게 마무리됩니다.", "note": "→ 실제 원료(카모마일/클라리세이지·사이프리올/워터·블론드우드)만 사용했습니다."}], "plus": {"notes": [{"pos": "Top", "name": "카모마일(Chamomile) / 클라리 세이지(Clary sage)", "everyday": "따뜻한 카모마일 티백을 우릴 때 꿀처럼 은은히 달다가 살짝 씁쓸하게 번지는, 편안한 허브 향이 떠오르는 순간이에요."}, {"pos": "Heart", "name": "사이프리올(Cypriol) / 워터 노트(Water)", "everyday": "비 갠 뒤 젖은 흙과 나무 결에서 올라오는 서늘하고 촉촉한 공기가 느껴지는 장면이에요."}, {"pos": "Base", "name": "블론드 우드(Blond wood) — 캐시메란/앰버", "everyday": "막 정돈한 원목 가구를 손으로 쓸어내릴 때 느껴지는 깨끗하고 포근한 나무의 잔향이에요."}], "tip": "허브차를 즐기시는 분이나 자연스럽고 편안한 스킨 향을 찾으시는 분께 권해보세요. 손목에 뿌린 뒤 시간이 지나면 포근한 우디 잔향이 살결처럼 남는다고 안내하시면 좋아요."}}, {"name": "EVENING GLOW (머스크 관점)", "base": "EVENING GLOW", "sub": "플로럴+머스크 — 따뜻한 플로럴을 머스크가 감싸는 구조", "respond": [{"label": "장면 워딩", "text": "첫인상은 딜 허브와 레몬처럼 프레시하고 상큼한 그린 시트러스로 열립니다. 이어 장미 꽃잎에 라즈베리 잼을 얹은 듯 우아하고 달콤한 플로럴이 화사하게 피어나고, 흙내음 감도는 사이프리올이 노을빛처럼 따뜻하고 깊게 마무리합니다.", "note": "→ 탑은 레몬·딜(피오니 아님), 베이스는 사이프리올"}, {"label": "전문 고객 워딩", "text": "탑의 레몬·딜(Lemon·Dill)이 시트러스 그린으로 산뜻하게 열고, 하트에서 로즈(Rose)의 우아함과 라즈베리(Raspberry)의 프루티 파우더리함이 어우러져 화사한 플로럴을 만듭니다. 베이스의 사이프리올(Cypriol)이 어스·아로마틱 우디로 받쳐 노을빛처럼 따뜻하고 깊은 플로럴 머스크 구조를 완성합니다.", "note": "→ 베이스는 사이프리올, 샌달우드·머스크 아님"}], "plus": {"notes": [{"pos": "Top", "name": "Lemon·Dill (레몬·딜)", "everyday": "요리에 딜 허브와 레몬을 곁들일 때 퍼지는, 프레시한 풀 향과 상큼한 시트러스가 산뜻하게 시작됩니다."}, {"pos": "Heart", "name": "Rose·Raspberry (로즈·라즈베리)", "everyday": "활짝 핀 장미 꽃잎의 우아한 향에 라즈베리 잼 같은 달콤함이 얹혀 부드럽고 화사하게 피어납니다."}, {"pos": "Base", "name": "Cypriol", "everyday": "흙내음이 감도는 강렬하고 아로마틱한 나무 향이 노을처럼 차분하고 깊게 잔향으로 남습니다."}], "tip": "'노을빛처럼 따뜻하고 부드러운 플로럴'이라는 콘셉트를 전하되, 시작은 레몬·딜로 상큼하다는 점을 짚어 주세요. 달콤한 플로럴을 좋아하면서 흙내음의 깊이를 원하는 고객께 특히 잘 맞습니다."}}, {"name": "PUMKINI", "base": "PUMKINI", "sub": "프루티+머스크 — 달콤한 프루티가 머스크와 결합, 포근한 스킨향", "respond": [], "plus": {"notes": [], "tip": ""}}, {"name": "LATE AUTUMN", "base": "LATE AUTUMN", "sub": "그린+머스크 — 드라이 그린이 머스크와 결합, 차분하고 잔잔한 잔향", "respond": [], "plus": {"notes": [], "tip": ""}}, {"name": "BATHER IN THE LAKE", "base": "BATHER IN THE LAKE", "sub": "모시+머스크 — 물기 있는 이끼 위 머스크, 습윤하고 자연스러운", "respond": [], "plus": {"notes": [], "tip": ""}}, {"name": "BOTTARI", "base": "BOTTARI", "sub": "앰버+머스크 — 앰버의 따뜻함이 머스크로 마무리, 관능적인 잔향", "respond": [], "plus": {"notes": [], "tip": ""}}, {"name": "SUNSHINE", "base": "SUNSHINE", "sub": "플로럴+우디+머스크 — 세 계열이 겹쳐진 복합 머스크 베이스", "respond": [], "plus": {"notes": [], "tip": ""}}], "approach": [{"title": "머스크 유형 세분화 질문", "text": "'클린하고 비누 같은 머스크인지, 달콤하고 포근한 스킨 머스크인지, 드라이하고 차분한 머스크인지'로 방향 좁히기. 메인 계열과 머스크의 조합으로 제품 연결."}, {"title": "감각 표현법", "text": "'막 샤워하고 나온 깨끗한 피부 향', '세탁한 침구의 보송보송한 향', '아무것도 안 뿌렸는데 향이 나는 것 같은 느낌'으로 표현. 머스크는 향이 나는 것보다 '향이 배어있는' 느낌으로 설명."}], "scripts": [{"who": "고객", "line": "머스키한 향 좋아하는데 어떤 게 있어요?"}, {"who": "직원", "line": "머스크가 탬버린즈에서 여러 향 안에 다양하게 들어가 있어서, 어떤 머스크를 좋아하시느냐에 따라 제품이 달라져요. 달콤하고 포근한 머스크면 PUMKINI, 드라이하고 차분한 머스크면 LATE AUTUMN, 플로럴이 감싸는 따뜻한 머스크면 EVENING GLOW가 잘 맞아요. 어떤 느낌이 더 끌리세요?", "note": "→ 머스크를 세 가지 유형으로 나눠 고객이 스스로 방향 선택하도록"}, {"who": "직원 (시향 유도)", "line": "머스크 계열은 뿌리고 바로보다 20~30분 후에 피부에 스며든 상태가 가장 예쁘거든요. 손목에 뿌려두시고 다른 제품들 둘러보시다가 다시 맡아보시겠어요?", "note": "→ 머스크 특성 활용해 자연스럽게 매장 체류 시간 연장"}], "upsell": ["머스크 계열 전체 → 바디로션이나 핸드크림 레이어링 제안으로 잔향 강화", "BOTTARI → 앰버+머스크의 따뜻함 좋아하는 고객에게 룸 디퓨저 연결 제안"], "caution": {"no": "'향이 약하게 느껴질 수도 있어요'", "yes": "'가까이서 느껴지는 은은한 잔향이 이 계열의 매력이에요'"}}, {"id": "citrus", "en": "Citrus", "kr": "시트러스 — 첫 인상이 가장 강렬한 계열", "c": {"bg": "#FEFAE0", "bd": "#F0D96B", "tx": "#7A5900", "ds": "#9A7210", "tabtx": "#7A5900"}, "desc": "공식 Accord 기준으로 시트러스 단독 태그는 BERGA SANDAL(Citrus+Woody)이 유일합니다. 단, CHAMO도 베르가못 탑 노트가 강한 제품이므로 시트러스 느낌을 원하는 고객에게 함께 제안할 수 있습니다. 시트러스는 탑 노트 특성상 지속력 보완 설명이 반드시 필요합니다.", "perfumes": [{"name": "BERGA SANDAL", "base": "BERGA SANDAL", "sub": "시트러스+우디 — 베르가못이 샌달우드 위에서 가장 클래식하게 표현된 시트러스", "respond": [{"label": "장면 워딩", "text": "베르가못과 라임이 스파클링하게 열리며 카다멈의 따뜻한 스파이시함이 살짝 감돌아요. 곧 향긋한 시더 아틀라스가 중심을 잡아주고, 마지막엔 부드러운 샌달우드와 은근히 스모키한 레더가 어우러져 클래식하고 세련되게 마무리됩니다.", "note": "→ 시트러스 탑에서 우디·레더 드라이다운으로 이어지는 구조를 살렸어요."}, {"label": "전문 고객 워딩", "text": "탑은 베르가못·라임의 시트러스에 카다멈의 아로마틱 스파이시가 얹혀 고급스럽게 열립니다. 하트의 시더 아틀라스는 텁텁함 없이 향긋한 우디를 더해주고, 베이스는 샌달우드의 부드럽고 기름진 나무 향과 Cuir DM 계열 레더의 스모키·애니멀릭함이 결합해 깊이를 완성합니다.", "note": "→ 노트로우 그대로 시트러스   h+=`<div class="pfhd">향수 목록 · 향수를 선택하면 상세로 이동</div>`;
  h+=`<div class="toc">`+a.perfumes.map((p,i)=>`<div class="row" data-pf="${i}"><div style="display:flex;align-items:center"><span class="idx">${String(i+1).padStart(2,'0')}</span><div><div class="nm">${esc(p.name)}</div>${p.sub?`<div class="sub">${esc(p.sub)}</div>`:''}</div></div><span class="arw">›</span></div>`).join('')+`</div>`;
  if(EDIT)h+=`<button class="add" id="addPf" style="margin-top:10px">＋ 향수 추가</button>`;
  return h;
}
function detailView(a,p){
  let h=`<div class="back" id="backBtn">‹ ${esc(a.en)} 목록</div>`;
  h+=`<div class="detail"><div class="dtag">${esc(a.en)}</div><h2>${esc(p.name)}</h2>${p.sub?`<div class="sub">${esc(p.sub)}</div>`:''}`;
  const kws=kwFor(p);
  h+=`<div class="dsec"><h3>향 키워드 <span style="color:#c9c0b2">· 향 맵 연동</span></h3><div class="chips">${kws.length?kws.map(k=>`<span class="chip kw">${esc(k)}</span>`).join(''):'<span style="font-size:12px;color:#b3a892">향 맵에 등록된 키워드가 없습니다</span>'}</div></div>`;
  if(p.respond&&p.respond.length)h+=`<div class="dsec"><h3>향수별 향료 응대 워딩</h3>${p.respond.map(w=>`<div class="word"><div class="wl">${esc(w.label)}</div><div class="wt">${esc(w.text)}</div>${w.note?`<div class="wn">${esc(w.note)}</div>`:''}</div>`).join('')}</div>`;
  const pl=p.plus||{notes:[],tip:''};
  if((pl.notes&&pl.notes.length)||pl.tip){h+=`<div class="dsec"><h3>향료 플러스 워딩</h3>`;h+=(pl.notes||[]).map(n=>`<div class="note"><div class="np" style="background:${a.c.tabtx}">${esc(n.pos)}</div><div><div class="nm">${esc(n.name)}</div><div class="ne">${esc(n.everyday)}</div></div></div>`).join('');if(pl.tip)h+=`<div class="tip"><b>TIP</b>${esc(pl.tip)}</div>`;h+=`</div>`;}
  h+=`</div>`;return h;
}
function detailEdit(a,p){
  let h=`<div class="back" id="backBtn">‹ ${esc(a.en)} 목록</div>`+actions()+`<div class="detail">`;
  h+=`<div class="el">향수명</div><input class="edi" id="e_name" value="${esc2(p.name)}">`;
  h+=`<div class="el">한 줄 설명</div><input class="edi" id="e_sub" value="${esc2(p.sub||'')}">`;
  h+=`<div class="el">향 키워드는 향 맵에서 관리됩니다 (표시만)</div>`;
  h+=`<div class="el">향수별 향료 응대 워딩</div><div id="e_resp">`+
    (p.respond||[]).map((w,i)=>`<div class="edrow"><div><input class="edi" data-rl="${i}" value="${esc2(w.label)}" placeholder="라벨"><textarea class="edt" data-rt="${i}" style="margin-top:5px" placeholder="워딩">${esc2(w.text)}</textarea><input class="edi" data-rn="${i}" style="margin-top:5px" value="${esc2(w.note||'')}" placeholder="메모(선택)"></div><button class="rm" data-rmr="${i}">삭제</button></div>`).join('')+
    `</div><button class="add" id="addResp">＋ 응대 워딩 추가</button>`;
  h+=`<div class="el">향료 플러스 워딩 — 노트</div><div id="e_notes">`+
    ((p.plus&&p.plus.notes)||[]).map((n,i)=>`<div class="edrow"><div><input class="edi" data-npos="${i}" value="${esc2(n.pos)}" placeholder="Top/Heart/Base"><input class="edi" data-nnm="${i}" style="margin-top:5px" value="${esc2(n.name)}" placeholder="향료명"><textarea class="edt" data-nev="${i}" style="margin-top:5px" placeholder="일상 향료 연결">${esc2(n.everyday)}</textarea></div><button class="rm" data-rmn="${i}">삭제</button></div>`).join('')+
    `</div><button class="add" id="addNote">＋ 노트 추가</button>`;
  h+=`<div class="el">TIP</div><textarea class="edt" id="e_tip">${esc2((p.plus&&p.plus.tip)||'')}</textarea>`;
  h+=`</div>`+actions();return h;
}
function listEdit(a){
  let h=actions()+`<div class="el">계열 설명</div><textarea class="edt" id="e_desc">${esc2(a.desc)}</textarea>`;
  h+=`<div class="el">향수 목록 (이름·삭제, 상세는 향수 선택 후 편집)</div><div id="e_pfs">`+
    a.perfumes.map((p,i)=>`<div class="edrow"><div><input class="edi" data-pn="${i}" value="${esc2(p.name)}"></div><button class="rm" data-openpf="${i}">상세편집</button><button class="rm" data-rmp="${i}">삭제</button></div>`).join('')+
    `</div><button class="add" id="addPf">＋ 향수 추가</button>`;
  h+=`<div class="gbox"><div class="gt">${esc(a.en)} 계열 응대 가이드 (편집)</div>`;
  h+=`<div class="el">어프로치 & 감각 표현법</div><div id="e_ap">`+
    (a.approach||[]).map((x,i)=>`<div class="edrow"><div><input class="edi" data-apt="${i}" value="${esc2(x.title)}" placeholder="제목"><textarea class="edt" data-apx="${i}" style="margin-top:5px">${esc2(x.text)}</textarea></div><button class="rm" data-rmap="${i}">삭제</button></div>`).join('')+`</div><button class="add" id="addAp">＋ 어프로치 추가</button>`;
  h+=`<div class="el">실전 응대 스크립트</div><div id="e_sc">`+
    (a.scripts||[]).map((s,i)=>`<div class="edrow"><div><input class="edi" data-scw="${i}" value="${esc2(s.who)}" placeholder="화자"><textarea class="edt" data-scl="${i}" style="margin-top:5px">${esc2(s.line)}</textarea><input class="edi" data-scn="${i}" style="margin-top:5px" value="${esc2(s.note||'')}" placeholder="메모"></div><button class="rm" data-rmsc="${i}">삭제</button></div>`).join('')+`</div><button class="add" id="addSc">＋ 스크립트 추가</button>`;
  h+=`<div class="el">연계 추천</div><div id="e_us">`+
    (a.upsell||[]).map((u,i)=>`<div class="edrow"><div><input class="edi" data-us="${i}" value="${esc2(u)}"></div><button class="rm" data-rmus="${i}">삭제</button></div>`).join('')+`</div><button class="add" id="addUs">＋ 연계 추천 추가</button>`;
  h+=`<div class="el">표현 주의 — 지양</div><input class="edi" id="e_cno" value="${esc2(a.caution&&a.caution.no||'')}">`;
  h+=`<div class="el">표현 주의 — 권장</div><input class="edi" id="e_cyes" value="${esc2(a.caution&&a.caution.yes||'')}">`;
  h+=`</div>`+actions();return h;
}
function render(){
  tabsRender();const a=GDATA[cur];
  let h;
  if(sel>=0&&sel<a.perfumes.length){const p=a.perfumes[sel];h=EDIT?detailEdit(a,p):detailView(a,p);}
  else{sel=-1;h=EDIT?listEdit(a):listView(a);}
  $('panel').innerHTML=h;bind(a);try{if(window.parent&&window.parent!==window){window.parent.postMessage({t:'accGuideTop'},'*');window.scrollTo(0,0);}else{window.scrollTo(0,0);}}catch(e){window.scrollTo(0,0);}
}
function readEdit(){const a=GDATA[cur];
  if(sel>=0&&$('e_name')){const p=a.perfumes[sel];
    p.name=$('e_name').value.trim()||p.name;p.base=p.name.replace(/\s*\(.*$/,'').trim().toUpperCase();p.sub=$('e_sub').value;
    p.respond=[...document.querySelectorAll('#e_resp .edrow')].map(r=>({label:r.querySelector('[data-rl]').value,text:r.querySelector('[data-rt]').value,note:r.querySelector('[data-rn]').value})).filter(w=>w.text||w.label);
    const notes=[...document.querySelectorAll('#e_notes .edrow')].map(r=>({pos:r.querySelector('[data-npos]').value,name:r.querySelector('[data-nnm]').value,everyday:r.querySelector('[data-nev]').value})).filter(n=>n.name||n.everyday);
    p.plus={notes:notes,tip:$('e_tip').value};return;}
  if($('e_desc')){a.desc=$('e_desc').value;
    const names=[...document.querySelectorAll('#e_pfs [data-pn]')].map(i=>i.value.trim());
    names.forEach((nm,i)=>{if(a.perfumes[i]){a.perfumes[i].name=nm||a.perfumes[i].name;a.perfumes[i].base=(nm||'').replace(/\s*\(.*$/,'').trim().toUpperCase();}});
    a.approach=[...document.querySelectorAll('#e_ap .edrow')].map(r=>({title:r.querySelector('[data-apt]').value,text:r.querySelector('[data-apx]').value})).filter(x=>x.title||x.text);
    a.scripts=[...document.querySelectorAll('#e_sc .edrow')].map(r=>({who:r.querySelector('[data-scw]').value,line:r.querySelector('[data-scl]').value,note:r.querySelector('[data-scn]').value})).filter(s=>s.who||s.line);
    a.upsell=[...document.querySelectorAll('#e_us .edrow')].map(r=>r.querySelector('[data-us]').value).filter(Boolean);
    a.caution={no:$('e_cno').value,yes:$('e_cyes').value};}
}
function bind(a){
  const bk=$('backBtn');if(bk)bk.onclick=()=>{if(EDIT)readEdit();sel=-1;render();};
  document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{sel=+b.dataset.pf;render();});
  if(EDIT){
    const g=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};
    g('addPf',()=>{readEdit();a.perfumes.push({name:'새 향수',base:'',sub:'',respond:[],plus:{notes:[],tip:''}});sel=a.perfumes.length-1;render();});
    g('addResp',()=>{readEdit();a.perfumes[sel].respond.push({label:'',text:'',note:''});render();});
    g('addNote',()=>{readEdit();a.perfumes[sel].plus.notes.push({pos:'',name:'',everyday:''});render();});
    g('addAp',()=>{readEdit();a.approach.push({title:'',text:''});render();});
    g('addSc',()=>{readEdit();a.scripts.push({who:'직원',line:'',note:''});render();});
    g('addUs',()=>{readEdit();a.upsell.push('');render();});
    document.querySelectorAll('[data-openpf]').forEach(b=>b.onclick=()=>{readEdit();sel=+b.dataset.openpf;render();});
    document.querySelectorAll('[data-rmp]').forEach(b=>b.onclick=()=>{readEdit();a.perfumes.splice(+b.dataset.rmp,1);render();});
    document.querySelectorAll('[data-rmr]').forEach(b=>b.onclick=()=>{readEdit();a.perfumes[sel].respond.splice(+b.dataset.rmr,1);render();});
    document.querySelectorAll('[data-rmn]').forEach(b=>b.onclick=()=>{readEdit();a.perfumes[sel].plus.notes.splice(+b.dataset.rmn,1);render();});
    document.querySelectorAll('[data-rmap]').forEach(b=>b.onclick=()=>{readEdit();a.approach.splice(+b.dataset.rmap,1);render();});
    document.querySelectorAll('[data-rmsc]').forEach(b=>b.onclick=()=>{readEdit();a.scripts.splice(+b.dataset.rmsc,1);render();});
    document.querySelectorAll('[data-rmus]').forEach(b=>b.onclick=()=>{readEdit();a.upsell.splice(+b.dataset.rmus,1);render();});
    document.querySelectorAll('[data-act=apply]').forEach(b=>b.onclick=()=>{readEdit();render();fbSave(true);});
    document.querySelectorAll('[data-act=save]').forEach(b=>b.onclick=()=>fbSave(false));
  }
}
function fbSave(silent){if(!fbRef){if(!silent)alert('저장이 준비되지 않았습니다.');return;}if(EDIT)readEdit();
  document.querySelectorAll('[data-act=save]').forEach(b=>b.textContent='저장 중…');
  fbRef.set({gdata:GDATA,ts:Date.now()}).then(()=>{document.querySelectorAll('[data-act=save]').forEach(b=>{b.textContent='✓ 저장됨';setTimeout(()=>b.textContent='☁ 모두에게 저장',1500);});if(!silent)alert('저장됐습니다! 링크로 들어오는 누구나 바로 볼 수 있어요.');}).catch(e=>{if(!silent)alert('저장 실패: '+e.message);});}
$('editBtn').onclick=()=>{if(EDIT){readEdit();EDIT=false;$('editBtn').textContent='✎ 편집';render();return;}const v=prompt('편집 비밀번호를 입력하세요');if(v===PASS){EDIT=true;$('editBtn').textContent='✓ 편집 종료';render();}else if(v!==null)alert('비밀번호가 올바르지 않습니다.');};
function applyParam(){const q=new URLSearchParams(location.search);const p=q.get('p');const acc=(q.get('acc')||'').toLowerCase();if(acc){const ai=GDATA.findIndex(a=>a.id===acc);if(ai>=0){cur=ai;sel=-1;if(p){const t=p.toUpperCase();const j=GDATA[ai].perfumes.findIndex(x=>((x.base||x.name||'').toUpperCase())===t);if(j>=0)sel=j;}return;}}if(p){const t=p.toUpperCase();for(let i=0;i<GDATA.length;i++){const j=GDATA[i].perfumes.findIndex(x=>((x.base||x.name||'').toUpperCase())===t);if(j>=0){cur=i;sel=j;return;}}}}
function loadKW(cb){firebase.database().ref('tamburins/overrides/scentKw').once('value').then(s=>{const v=s.val()||{};Object.keys(v).forEach(k=>{const arr=(v[k]||[]).map(o=>o&&o.t?o.t:o).filter(Boolean);if(arr.length)KW[k.toUpperCase()]=arr;});cb();}).catch(cb);}
function init(){try{firebase.initializeApp(FB);fbRef=firebase.database().ref('tamburins/accordGuide');
  fbRef.once('value').then(s=>{const v=s&&s.val?s.val():null;
    if(v&&v.gdata&&v.gdata.length){const byId={};v.gdata.forEach(a=>byId[a.id]=a);
      GDATA=GDATA.map(base=>{const fb=byId[base.id];if(!fb)return base;
        return Object.assign({},base,fb,{approach:(fb.approach&&fb.approach.length)?fb.approach:base.approach,scripts:(fb.scripts&&fb.scripts.length)?fb.scripts:base.scripts,upsell:(fb.upsell&&fb.upsell.length)?fb.upsell:base.upsell,caution:(fb.caution&&(fb.caution.no||fb.caution.yes))?fb.caution:base.caution});});}
    loadKW(()=>{applyParam();render();});}).catch(()=>loadKW(()=>{applyParam();render();}));
}catch(e){render();}}
init();
</script></body></html>
