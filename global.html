*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#2b2824;--muted:#8a8177;--line:#e7e0d4;--bg:#faf7f1;--card:#fff;--accent:#6b5c4a;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Microsoft YaHei',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.ttl{font-family:'TITLEFONT',serif;text-transform:uppercase;letter-spacing:.05em;}
.hero{text-align:center;padding:46px 20px 14px;background:linear-gradient(#efe9df,#faf7f1);border-bottom:1px solid var(--line);}
.hero .lab{font-family:'TITLEFONT',serif;text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:var(--muted);}
.hero h1{font-size:32px;margin-top:12px;letter-spacing:.08em;}
.hero p{margin-top:10px;color:#6b6156;font-size:13.5px;}
.langs{display:flex;gap:6px;justify-content:center;margin-top:18px;}
.langs button{font-family:'Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Microsoft YaHei',-apple-system,sans-serif;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 15px;}
.langs button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:20px 16px 6px;}
.bar button{font-family:'Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Microsoft YaHei',-apple-system,sans-serif;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;}
.bar button.on{background:#6b5c4a;color:#fff;border-color:#6b5c4a;}
.cnt{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 2px;}
.grid{max-width:1180px;margin:0 auto;padding:14px 18px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.16s;position:relative;}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.08);}
.card .pic{aspect-ratio:1/1;background:#f3efe7;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.card .pic img{width:100%;height:100%;object-fit:contain;}
.card .pill{position:absolute;top:10px;left:10px;font-size:10px;border-radius:999px;padding:3px 9px;}
.pill.sale{background:#3c5230;color:#fff;}.pill.disc{background:#efe9df;color:#7a6f60;border:1px solid var(--line);}
.card .info{padding:14px 15px 16px;}
.card .nm{font-family:'TITLEFONT',serif;text-transform:uppercase;font-size:15px;letter-spacing:.03em;}
.card .accs{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
.accchip{font-size:10.5px;border-radius:999px;padding:3px 9px;}
.overlay{position:fixed;inset:0;background:rgba(30,26,22,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.overlay.on{display:flex;}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto;position:relative;}
.modal .x{position:absolute;top:14px;right:16px;width:30px;height:30px;border:none;background:#f3efe7;border-radius:50%;font-size:16px;cursor:pointer;z-index:2;}
.mtop{display:grid;grid-template-columns:230px 1fr;gap:0;}
@media(max-width:600px){.mtop{grid-template-columns:1fr;}}
.mpic{background:#f3efe7;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mpic img{width:100%;height:100%;object-fit:contain;}
.mbody{padding:26px 28px;}
.mbody .lab{font-family:'TITLEFONT',serif;text-transform:uppercase;font-size:10px;letter-spacing:.14em;color:var(--muted);}
.mbody h2{font-family:'TITLEFONT',serif;text-transform:uppercase;font-size:24px;letter-spacing:.03em;margin:5px 0 3px;}
.mbody .meta{font-size:12px;color:#6b6156;margin-top:8px;}
.mbody .accs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}

s the quiet mood of late autumn. Galbanum and buchu, evoking a vast land, meet bittersweet bitter orange for a warmth like autumn sunlight, while a soft musk arriving at the edge of the faded green scenery remains as a vivid afterimage.", "cn": "随风缓缓起舞、彼此交缠的甘蔗田里，那缕若隐若现的草香，衬托出深秋静谧的情致。令人联想到辽阔大地的白松香与布枯，与苦甜的苦橙相遇，带来秋日暖阳般的温度；在褪色绿意的尽头到来的柔和麝香，则化作脑海中清晰的余像。", "jp": "風に揺れながらゆるやかに舞う、さとうきび畑のかすかな草の香りが、晩秋の静かな情趣を引き立てます。広大な大地を思わせるガルバナムとブクは、ほろ苦いビターオレンジと出会って秋の陽だまりのような温もりを届け、色あせた緑の景色の果てに訪れる柔らかなムスクが、鮮やかな残像として心に残ります。"}}, {"name": "Brown", "kr": "브라운", "bigcat": "판매중", "accords": ["Amber", "Woody"], "notes": "Grass · Mahogany · Oakwood", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAL4AmYDASIAAhEBAxEB/8QAHAABAQADAQEBAQAAAAAAAAAAAAECAwQFBgcI/8QAUBAAAgECAwQFBggLBgUEAwEAAAECAxEEBSESMUFRBhNhcbEUIjKBkdEjM1JicqGywRUkJTQ1QmNzgpLhBxZDU3STRFRkovA2g8LSF0WU8f/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/8QAHxEBAQEBAQEAAwEBAQAAAAAAABEBMQISAyEyQRMi/9oADAMBAAIRAxEAPwD+hbgiB3eUA4D3hDmAwFCci8xyJqowOBDKqCAAAAAAAXFwQC3C3oi3BPcA4AB8QKOJABQRBAUAGsRSAFBkAApACAGCPiQwA59w5EUAADn3i+ge/wBZFwAoAApByBUGAwBByA5AOA4BbhwZFAwQCoAFQABQABQZACAECEF4AAFAyB7gK2QcwwKQBgGAQC8xyJzBRb6IE4AqOhbgAECFIAfEtycQBfcOKJ7gFHuIHuBnVwABFACAAUgDmB7gAQQQADmQr3eoAAQCgAAUgNYikAKAAAMBgmiABk0w59xC8+4hFVk5gAOYW4AAtxScAA4FIEXE1eZACgFvRFrcvBEE4F5k3IcyKAAAUhTSABCoAcgAuAQig4AEABcAigOAADiOBBwIKGTgADAIBWLkKUAAVG8ABAAgFBCgBxIADABNaQBjiSFCkKAZCkLA9wHuBBCkAAcPUOYWvsIoBwQAAAqLxBClAEBQAABgAgAEIADJxIqgEAoIAHADiOQDgW5jwKMFBAaxAvIEe4aF95OLHEIgFIAKAiFRQwCoEDAXAAnEKovYguQOJSAAAT3gXh6wPeTiQOZbkX3DkBeROY4DmABClwATgCxHQLgBAE4hAUD3gACAAUguFAOAJFAAVADiAie4pAFAASKj4l9xOLKgHBAhQHFAcUQQXiL6EDKLwG9ggDiUgADiBxAAEIK+JA+IIAAAAIgFHIheQE5h7mBwYFCICi3JwAGhfUi4FIQUEAFBOZSgLkBUV8QLkAcAwRhVBCkEFxyHAAHuYD1TKHMcRwZCC8iLchx9YQF4Ml9fUN9xyAAhRgbwLgo3sBjmGTiF4E4l5AF94IAKCAopOYIwKACAUgAcRcDiUARDgQ  on light, while earthy patchouli and cypriol add weight like elegant, protective thorns, revealing yet another complete rose.", "cn": "每一个瞬间，玫瑰都以玫瑰的姿态完美存在。从种子萌发到绚烂绽放，看似不断变化，却始终蕴含玫瑰独有的美。夕阳将玫瑰染成覆盆子般的绯红，清新的莳萝与明亮的柠檬皮层叠出光感，而带着泥土气息的广藿香与莎草，如守护般优雅的尖刺增添分量，呈现出又一朵完整的玫瑰。", "jp": "どの瞬間にも、薔薇は薔薇として完璧に存在します。種から芽吹き華やかに咲き誇る一瞬一瞬、絶えず移ろうように見えて、本質的に薔薇はその固有の美しさを宿しています。夕焼けが薔薇をラズベリーのように赤く染め、爽やかなディルと明るいレモンピールが光を重ね、土の香りのパチュリとサイプリオールが優雅な棘のように重厚さを加えて、もう一つの完全な薔薇を映し出します。"}}, {"name": "Bottari", "kr": "보타리", "bigcat": "판매중", "accords": ["Amber", "Musk"], "notes": "Akigala wood · Ambrette / Moss · Ambergris", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAKAAgUDASIAAhEBAxEB/8QAHAABAQACAwEBAAAAAAAAAAAAAAECAwQFBwYI/8QAVxAAAgEDAQUEBQYICggEBAcAAAECAwQRBQYSITFBBxNRYSJxgZGxFDJSocHRFSMzQmJyc7IkNDY3U3SCkqLhFhcmQ0Rjg/AlNUWTCBiE4lRVZKSzwtL/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/8QAHBEBAQEBAQEBAQEAAAAAAAAAAAERAiExEkFR/9oADAMBAAIRAxEAPwD3YEyXJpAdCACggAAEJVUdSAgoBAKCEAoAAAdQugAEKABMjJReoIUqBCkyBQMkArIBniQATwAUHiMh9QGQB1AoICoE6lIAAJ1AuQTxBFCjJMgUELkqCBB0AAEAoIAGQAABGygBngQAC5IgAZSeBclRAAUb8ggMqo8CBAMlIM8wAAIAAIoCZGSikGQAAJkChEfUqZBCkGQAAyVFGSAoZAYCAyAFMjqTqCC+BBkgVQ+pMjxAo6kb4B8wKOhAUUEyRsIoREVAPEZICKAmSlRQQZAuRkxyUqDYICKZBCgAAABMjIFBMgBkZAAZ4FICxFBAUbyZAMi5BOoApAAAyQZCrkmQCKADJUAMkAoIAHQJ8SeI6tkVl0IPvIBc8QTqy54FQ6AeIyABAiooyTIIqk6AjAoICKpMghRRkE6gXPAEARQToAKiZ5DJAKAAAIUAMjJMlRQR/aAKQAimQTxAFyMkADIAAAheoDIDIBcggLBkCZwCo3ZGSAyLnih09hEPuAuRkgKKyAMgAgCqBkhUUdSDqBegJ0GSKPkCZ4FzzAdSZDYAoJkZAZC5AZKKToMkyBkToMkyEXPEg6jPAigGSAUAAAiMABkgAvQuSAC5IMjIAEAFGSZGQKOpjkuQLkMmcEyBQQAAB1AoIAHiATIFAyRsC/eCZJkDIdTEuSigmQEbhkn3jPAAnyKTw9Q+4C5GSZHgBcjPMnQcgKiMmS/cABBkCjqQFF6AgIGS9TEvUAAToBRkEAvUEGQqgmQBSdAMhDqR8hkMigGSAUuTHIQGWRniYhcwKCABkuSAC5JkACkAyABABQQAUjHQdAAHUAUhMjIFGSAqKQZGQKQZJkir9xAFyAoJ4AooJkBG7IXQjLkofcPuIPuAofImS5AZBHyAF6jJAQMg ision of a clear autumn night within the softness of guaiac wood and musk.", "cn": "仿佛梦见在满是清新当归的森林中自由驰骋的瞬间。身披如云般轻盈的银色铠甲，划过闪烁阳光奔跑时那份彻底的自由，唤醒原始的感官——与咸润的泥土气息一同，绽放出铃兰淡雅的花香，随后在愈创木与麝香的柔和中，展现出澄澈秋夜的幻境。", "jp": "新鮮なアンジェリカが咲き乱れる森を自由に駆け抜ける瞬間を夢見るような香り。雲のように軽い銀の鎧をまとい、きらめく陽光を切って走るときに感じる完全な自由が原初の感覚を呼び覚まし、塩気を帯びた土の香りとともにミュゲの淡い花の香りへと広がり、ガイアックウッドとムスクの柔らかさの中に澄んだ秋の夜の幻想を映し出します。"}}, {"name": "Puppy", "kr": "퍼피", "bigcat": "판매중", "accords": ["Nutty", "Herbal"], "notes": "Paw accord / (Nutty wood) · Blue Chamomile · Aldehydes", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAKAAgUDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAECAwQFBggH/8QAVhAAAgEDAQQDCwcHBgwGAwEAAAECAwQRBQYSITETQVEHFBYiUmFxgZGT0RUyVVahscEjMzRCYnKSFyQ1VJSiJTZERUZkc4OywtLhCCZDY3SCU/DxhP/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/EABcRAQEBAQAAAAAAAAAAAAAAAAARARL/2gAMAwEAAhEDEQA/APuQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACN+OcbyyurJPPrXtMSpGffEmo5XDrLnjQxvRaz6DO6uYyN1+YbjKIyz1fcXE5eS/sF1YdHPsHRy7C4nLHzJEOT8iX2CpFG5LzEbr83tKm35D+wtSb8l+1CrFWMda9oyvKXtLLl+z9xbcv2X7ULpGTvR8qPtG9HykYbU3yg/aglU5bj9qF0jKdemuc17Sl3VFc6sfaa6qpZfiv2oxpqXk/ahdI3DvLZc60SHf2i/9eBoJqXk/aixNS7F7 : {"en": "Bilingual draws inspiration from the experience of two different languages meeting to expand into new meaning. The clean, orderly floral scent of orange blossom meets marshmallow to become fluffy cotton candy, and a contrasting bitter, leathery tobacco note joins in — two opposing scents that once existed independently now entwine around each other, offering an unfamiliar harmony.", "cn": "“Bilingual”的灵感源自两种不同语言相遇、扩展出新含义的体验。橙花洁净而井然的花香与棉花糖相遇，化作蓬松的棉花糖；与之形成对比的、带皮革感的微苦烟草气息交织其中——原本各自独立、彼此相反的两种香气如今相互缠绕，带来陌生而奇妙的和谐。", "jp": "「Bilingual」は、異なる二つの言語が出会い、新たな意味へと広がっていく体験から着想を得ています。オレンジブロッサムの清潔で端正なフローラルがマシュマロと出会ってふんわりとした綿菓子になり、対照的にほろ苦くレザリーなタバコノートが重なって、独立して存在していた相反する二つの香りが互いに絡み合い、見知らぬ調和を体験させます。"}}, {"name": "French Needle", "kr": "프렌치 니들", "bigcat": "단종", "accords": ["Woody", "Spicy"], "notes": "Elemi · Olibanum · Cedarwood\u000bPine French Needle", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAIeAeEDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAAAAIBAwQFBgcI/8QAVRAAAgEDAgMCBwoJCAgGAgMAAAECAwQRBRIGEyExQQciUWFxkbEUMlJyc4GhssHRFSMkJTM2QmKSFjVDU2OCouEINFRkg5Oz0iZEdMLi8RejGFXw/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAKhEBAAIBAwQBBAIDAQEAAAAAAAERAgMhMRITMlFBBBQicTOBQmGRUqH/2gAMAwEAAhEDEQA/AOP2htLtobT5L56naG0u2k7RYocQ2l20NosU7Q2l20naLFO0Npc4+YjaLFW0NqLtobBYp2htLtgbBYp2htLtiDYLFO0NpdtDahYp2htLtgbRYp2htLtpO0WKNobS/aRsFinaG0v2htFijaG0v2kbRYp2htL9obRYo2htL9obRYo2htL9obRYo2htL9obRYo2htL9obRYo2htL9obRYo2htL9obRYo2htL9obRYo2htLtpO0WKNobS/aG0WKNobS/aG0WKNobS/aG3zCxRtDaX7Q2ixRtDaX7Q2ixRtDaX7Q2ixRtDaX7Q2ixRtAv2gLFmAwW7Q2kRVgMFu0NoFWA2lu3zBtFivAbSzaG0WK9obS3aRtJYr2hgt2htFirAYLNpO0WKtobS3YG0WKsBtLdgbRYq2hgt2BsFirAYLdgbBYqwGC3YGwWKsBgu2BsFinAYLtgbBYpwG0u2INiFinaGC7aGwWKcBgu2BsFinAYLtgbBYp2hgu2BsFinAbS7YGxCxTtDaXbEGwWKcBgt2E7BYp2hgu2INgsU4DBdsQbBYpwGC7Yg2CxTgMF2wNgsU7QwXbA2IWKcBgu2INgsU4DBdsDYLFO0Npd  50ml / 159,000원", "jp": "オードパルファム · 50ml / 159,000원"}, "desc": {"en": "It evokes a cool breeze blowing from the border between an emerald sea dyed by sunlight and the forest. Sweet rosewood and bergamot open with a pleasant freshness, and a sea-salt note carrying a briny scent reflects the memory of a leisurely summer day. Cedarwood and musk then wrap warmly around it, closing with a grounded weight.", "cn": "令人联想到从被阳光染成翡翠色的海洋与森林交界处吹来的清凉微风。香甜的玫瑰木与佛手柑开启愉悦的清爽，带着咸润海洋气息的海盐香，映照出悠闲夏日的回忆。随后雪松与麝香温暖包裹，以沉稳的分量收尾。", "jp": "陽光に染まったエメラルド色の海と森の境界から吹く涼やかな風を思わせます。甘いローズウッドとベルガモットが心地よい爽やかさで幕を開け、塩気を帯びた海の香りのシーソルトが、のどかな夏の日の思い出を映します。続くシダーウッドとムスクが温かく包み込み、重厚感をもって締めくくります。"}}, {"name": "Salty Vanilla", "kr": "솔티 바닐라", "bigcat": "단종", "accords": ["Vanilla", "Amber"], "notes": "White Pepper · Sand · Vanilla", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAKAAoADASIAAhEBAxEB/8QAHAAAAwEBAQEBAQAAAAAAAAAAAAECAwQFBgcI/8QAURAAAgEDAgQCBgMKCwcCBgMAAAERAgMhBBIFEzFBUWEGInGBkbEUMnIjJDM0QlJiobLBFSU1Q1Njc4KDktEHFkRUs+Hwk6ImRZTC0uKEo/H/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QAKBEBAQEAAgEEAwABBQEBAAAAABEBAjESAxMhQRQyUQRCYoGRoSJh/9oADAMBAAIRAxEAPwD5iMEpZLjAY8D7r86mAgqJCAJArHgGH2AkIKSACQga6jhATGBRkqAwULuDRXuHAEdB9hwEEE7YDsUwSKJHCgbUjjAEQEFQAExkIyUkOAJgUFBgCYBopdRtAQEFdwiQFARgp0iWAFAQUAEsSRUDgCegRLKgAJgChJASOCgYEwEIaHAEtQhQU0OAJgIKEAnkSRYu4CSBIqAaAnMg+g4hDjAC7C6jHAEoHkY4wBKWR4DuNoBQDQ4fgOAIwMIyOAFAowUKAElA4AYCgBwAEvINFQEASkOMjSCMgTA0h+QkgF0HEoClAENAW0KAABxAQAgyVAQQTAJ5KYoKCBFQ4BICUBSWRNAKAUIcYBIBAhwCAEsg1kYATAQWIBQIpiQCAb6iaAB9hQ4gcYASCBxA+wCUDYhw2BPcJgcCaAG2wHDgcKOoExCHGBwEATAQVAQBI4HGQgCYHGAjI4AmMAUEQBMBkqAjACgIHAQBPccZHEsawwIeGEZKaBLACgcZGgXUCYB9CoyD6gT2yKCggBRI9sIcCfQCYyMfYGkALoEygSwCQCjINFBDAmBIsUKcAECgqMC94BAocj7g0ANSKBocALuJooGBKQoyV0BdSoXuCO42ggKQQMIAIYd+oxQQMO4IfYCe4IfcYCFGRgvEBMOowiAFAQMAEwXQbBLACXUGMAE+ 感的檀香，如撒落肌肤的柔软细沙，以温暖惬意的余韵久久停留。", "jp": "砂漠の乾いた塩気を含んだ空気をまとった砂粒が、陽光の下で軽やかに輝きます。レモンの爽やかさが胡椒のスパイシーさと出会い、白く砕ける波の泡のような生命力を伝え、パインニードルの涼やかな香りが砂漠の暑さを爽快さで満たします。続く甘いバニラとクリーミーなサンダルウッドが、肌に散った柔らかな砂のように心地よい余韻を長くとどめます。"}}, {"name": "Bold Citrus", "kr": "볼드 시트러스", "bigcat": "단종", "accords": ["Nutty", "Citrus"], "notes": "Blood Orange · Cassia Seed · Cypriol", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4QEERXhpZgAASUkqAAgAAAAGABIBAwABAAAAAQAAABoBBQABAAAAsAAAABsBBQABAAAAuAAAACgBAwABAAAAAgAAABMCAwABAAAAAQAAAGmHBAABAAAAVgAAAAAAAAAHAACQBwAEAAAAMDIzMQGRBwAEAAAAAQIDAACgBwAEAAAAMDEwMAGgAwABAAAA//8AAAKgAwABAAAA9AEAAAOgAwABAAAA9AEAAIaSBwA8AAAAwAAAAAAAAABgAAAAAQAAAGAAAAABAAAAQVNDSUkAAAB4cjpkOkRBRjQtcHhhaFFnOjIxLGo6NjgxMjEwOTMzNTYzNTk4MzE5OCx0OjI0MDEwOTAx/+EFMmh0dHA6Ly9ucy5hZG9iZS5jb20veGFwLzEuMC8APHg6eG1wbWV0YSB4bWxuczp4PSdhZG9iZTpuczptZXRhLyc+CiAgICAgICAgPHJkZjpSREYgeG1sbnM6cmRmPSdodHRwOi8vd3d3LnczLm9yZy8xOTk5LzAyLzIyLXJkZi1zeW50YXgtbnMjJz4KCiAgICAgICAgPHJkZjpEZXNjcmlwdGlvbiByZGY6YWJvdXQ9JycKICAgICAgICB4bWxuczpkYz0naHR0cDovL3B1cmwub3JnL2RjL2VsZW1lbnRzLzEuMS8nPgogICAgICAgIDxkYzp0aXRsZT4KICAgICAgICA8cmRmOkFsdD4KICAgICAgICA8cmRmOmxpIHhtbDpsYW5nPSd4LWRlZmF1bHQnPk7GsOG7m2MgSG9hIFRhbWJ1cmlucyBCb2xkIENpdHJ1cyBZIFBlcmZ1bWUgLSBOxrDhu5tjIEhvYSBUYW1idXJpbnMgQm9sZCBDaXRydXMgWSBQZXJmdW1lPC9yZGY6bGk+CiAgICAgICAgPC9yZGY6QWx0PgogICAgICAgIDwvZGM6dGl0bGU+CiAgICAgICAgPC9yZGY6RGVzY3JpcHRpb24+CgogICAgICAgIDxyZGY6RGVzY3JpcHRpb24gcmRmOmFib3V0PScnCiAgICAgICAgeG1sbnM6QXR0cmliPSdodHRwOi8vbnMuYXR0cmlidXRpb24uY29tL2Fkcy8xLjAvJz4KICAgICAgICA8QXR0cmliOkFkcz4KICAgICAgICA8cmRmOlNlcT4KICAgICAgICA8cmRmOmxpIHJkZjpwYXJzZVR5cGU9J1Jlc291cmNlJz4KICAgICAgICA8QXR0cmliOkNyZWF0ZWQ+MjAyNC0wMS0wOTwvQXR0cmliOkNyZWF0ZWQ+CiAgICAgICAgPEF0dHJpYjpFeHRJZD5jYjk3YTc3Zi03NTAxLTRjNmQtYTI3Ny0xMDc5OWE5YmJiYjg8L0F0dHJpYjpFeHRJZD4KICAgICAgICA8QXR0cmliOkZiSWQ+NTI1MjY1OTE0MTc5NTgwPC9BdHRyaWI6RmJJZD4KICAgICAgICA8QXR0cmliOlRvdWNoVHlwZT4yPC9BdHRyaWI6VG91Y2hUeXBlPgogICAgICAgIDwvcmRmOmxpPgogICAgICAgIDwvcmRmOlNlcT4KICAgICAgICA8L0F0dHJpYjpBZHM+C const AC_DEF={bg:'#ece5da',fg:'#5b4a3a'};
let lang='en', filt='all', curModal=-1;
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $=id=>document.getElementById(id);
function accChip(a){const c=ACC[a]||AC_DEF;return `<span class="accchip" style="background:${c.bg};color:${c.fg}">${esc(a)}</span>`;}
function renderBar(){const u=UI[lang];$('bar').innerHTML=[['all',u.all],['판매중',u.sale],['단종',u.disc]].map(([k,t])=>`<button data-f="${k}" class="${filt===k?'on':''}">${esc(t)}</button>`).join('');
  $('bar').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filt=b.dataset.f;render();});}
function render(){
  const u=UI[lang];document.documentElement.lang=lang==='cn'?'zh':(lang==='jp'?'ja':'en');
  $('sub').textContent=u.sub;
  $('langs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  renderBar();
  const list=DATA.filter(p=>filt==='all'?true:p.bigcat===filt);
  $('cnt').textContent=list.length+' '+u.count;
  $('grid').innerHTML=list.map((p,idx)=>{
    const gi=DATA.indexOf(p);
    const pill=p.bigcat==='판매중'?`<span class="pill sale">${esc(u.status_sale)}</span>`:`<span class="pill disc">${esc(u.status_disc)}</span>`;
    return `<div class="card" data-i="${gi}"><div class="pic">${p.img?`<img src="${p.img}" loading="lazy">`:''}</div>${pill}<div class="info"><div class="nm">${esc(p.name)}</div><div class="accs">${(p.accords||[]).map(accChip).join('')}</div></div></div>`;
  }).join('');
  $('grid').querySelectorAll('.card').forEach(c=>c.onclick=()=>openModal(+c.dataset.i));
}
function openModal(i){const p=DATA[i],u=UI[lang];
  $('modal').innerHTML=`<button class="x" onclick="closeModal()">×</button>
   <div class="mtop"><div class="mpic">${p.img?`<img src="${p.img}">`:''}</div>
   <div class="mbody"><div class="lab">${p.bigcat==='판매중'?esc(u.status_sale):esc(u.status_disc)}</div>
     <h2>${esc(p.name)}</h2>
     <div class="meta">${esc(p.meta[lang]||'')}</div>
     <div class="accs">${(p.accords||[]).map(accChip).join('')}</div>
     ${p.notes?`<div class="sec"><h3>${esc(u.notes)}</h3><div class="notes">${esc(p.notes)}</div></div>`:''}
     <div class="sec"><div class="desc">${esc(p.desc[lang]||'')}</div></div>
   </div></div>`;
  curModal=i;$('ov').classList.add('on');document.body.style.overflow='hidden';
}
function closeModal(){curModal=-1;$('ov').classList.remove('on');document.body.style.overflow='';}
$('ov').onclick=e=>{if(e.target===$('ov'))closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('langs').querySelectorAll('button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render();if(curModal>=0)openModal(curModal);});
render();
