:root{--ink:#2b2824;--muted:#8d8678;--line:#e7e1d6;--bg:#ffffff;--paper:#faf8f5;}
body{font-family:'AppleR','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6;}
.wrap{max-width:1040px;margin:0 auto;padding:16px 18px 60px;}
.bar{display:flex;gap:8px;justify-content:flex-end;padding:10px 4px;}
.blink{font-family:'AppleR';font-size:12.5px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;background:#fff;text-decoration:none;}
.blink:hover{border-color:#c9bfae;}
.hero{text-align:center;padding:18px 0 8px;}
.hero h1{font-family:'AppleM';font-size:27px;font-weight:700;letter-spacing:-.01em;}
.hero .en{font-family:'AppleM';font-size:12px;letter-spacing:.22em;color:#b7a892;margin-top:6px;}
.hero p{font-size:13.5px;color:var(--muted);margin-top:10px;}
.shead{font-family:'AppleM';font-size:15px;margin:34px 4px 14px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.scard{border:1px solid var(--line);border-radius:16px;padding:18px 16px;cursor:pointer;transition:.16s;background:#fff;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;}
.scard:hover{transform:translateY(-3px);border-color:transparent;box-shadow:0 8px 22px rgba(60,50,30,.08);}
.scard .ci{font-family:'AppleM';font-size:11px;letter-spacing:.18em;}
.scard .ct{font-family:'AppleM';font-size:20px;margin-top:8px;}
.scard .cs{font-size:12.5px;color:var(--muted);margin-top:3px;}
.scard .cg{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5;}
.scard .arw{font-size:13px;color:#c0b6a4;align-self:flex-end;margin-top:8px;}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.pcard{border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;transition:.16s;background:#fff;}
.pcard:hover{transform:translateY(-3px);border-color:#c9bfae;box-shadow:0 8px 22px rgba(60,50,30,.07);}
.pcard .pn{font-family:'AppleM';font-size:15px;}
.pcard .pc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
.pcard .pp{font-size:12px;color:#9a948a;margin-top:9px;display:flex;flex-wrap:wrap;gap:5px;}
.chip{font-size:10.5px;color:#8d8678;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:#8d8678;}
.ov{position:fixed;inset:0;background:rgba(40,36,30,.42);display:none;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:50;overflow:auto;}
.ov.on{display:flex;}
.modal{background:#fff;border-radius:20px;max-width:680px;width:100%;overflow:hidden;animation:min .34s cubic-bezier(.22,.61,.36,1);box-shadow:0 20px 60px rgba(40,30,15,.22);}
@keyframes min{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.mhead{padding:22px 24px;position:relative;}
.mhead .mtag{font-family:'AppleM';font-size:10.5px;letter-spacing:.16em;opacity:.8;}
.mhead h2{font-family:'AppleM';font-size:23px;margin-top:7px;}
.mhead .mtagline{font-size:13px;margin-top:6px;opacity:.92;}
.mhead .notes{font-size:12px;margin-top:11px;line-height:1.55;opacity:.85;border-top:1px solid rgba(0,0,0,.08);padding-top:9px;}
.mx{position:absolute;top:16px;right:18px;font-size:20px;cursor:pointer;line-height:1;opacity:.7;background:none;border:0;color:inherit;}
.mx:hover{opacity:1;}
.mbody{padding:6px 24px 26px;}
.msec{margin-top:20px;}
.mst{font-family:'AppleM';font-size:13px;margin-bottom:6px;}
.mdesc{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.6;}
.grp{border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;background:var(--paper);}
.grp .gl{font-family:'AppleM';font-size:12.5px;}
.grp .gw{font-size:12.5px;margin-top:4px;line-height:1.6;}
.grp .gr{font-size:11.5px;color:var(--muted);margin-top:5px;}
.exq{font-size:12px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px;color:#6b6456;}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.tcard{border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
.tcard .te{font-family:'AppleM';font-size:12.5px;}
.tcard .tk{font-size:11px;color:var(--muted);margin-top:1px;}
.tcard .td{font-size:11.5px;margin-top:5px;line-height:1.5;color:#5b5349;}
.srow{border-left:3px solid #ccc;padding:3px 0 3px 13px;margin-bottom:14px;}
.srow .sl{font-family:'AppleM';font-size:11.5px;}
.srow .sp{font-size:13.5px;margin-top:4px;}
.srow .ste{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.01em;}
.scbox{border-radius:12px;padding:13px 15px;margin-top:10px;}
.scbox .scl{font-family:'AppleM';font-size:10.5px;letter-spacing:.04em;margin-bottom:6px;}
.scbox .sct{font-size:13px;line-height:1.65;}
.foot{font-size:11px;color:var(--muted);margin-top:14px;}
@media(max-width:820px){.sgrid{grid-template-columns:repeat(2,1fr);}.pgrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.sgrid,.pgrid{grid-template-columns:1fr;}.tgrid{grid-template-columns:1fr;}}
@media(prefers-reduced-motion:reduce){.modal{animation:none;}.scard:hover,.pcard:hover{transform:none;}}
</style></head><body>

aste": {"p": "라즈베리의 새콤함과 스모키한 뒷맛", "t": "Tart · Smoky"}, "easy": "서늘한 유칼립투스와 붉은 라즈베리가 그을린 나무 위에서 만나는, 낯설고 매력적인 향이에요.", "pro": "서늘한 유칼립투스와 주시한 라즈베리가 스모키한 우드와 대비를 이루는, 의도된 디소넌스가 매력인 구성입니다.", "foot": "※ 세부 탑 · 미들 · 베이스 노트는 공식 상세 페이지에서 확인 필요"}, {"name": "MEOK", "notes": "나무의 그을음 · 기름의 묵직함", "concept": "삼청 플래그십 전용, 서예의 먹에서 받은 깨끗하고 정제된 분위기", "vision": {"p": "먹빛, 하나의 톤", "t": "Monochrome · Smoky"}, "sound": {"p": "붓이 종이를 스치는 사각거림", "t": "Hushed"}, "touch": {"p": "벼루처럼 매끄럽고 마른", "t": "Smooth · Dry"}, "taste": {"p": "스모키한 뒷맛", "t": "Smoky · Dry"}, "easy": "먹을 가는 고요한 시간처럼, 그을린 나무와 묵직한 기름의 결이 정갈하게 번져요.", "pro": "스모키하고 드라이한 우디. 모노크롬처럼 절제된 톤의 레지너스한 깊이가 있습니다.", "foot": "※ 향 설명은 프라이빗 서비스 기획안 3층 스크립트 기준"}];
const COL={vision:{ink:'#8A5A12',bg:'#FBF1DC'},sound:{ink:'#27547F',bg:'#E7F0FA'},touch:{ink:'#3E6B2E',bg:'#EAF3E0'},taste:{ink:'#9A3B28',bg:'#FBE9E2'}};
const SKEY=['vision','sound','touch','taste'];
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $=id=>document.getElementById(id);
function senseCards(){
  return SENSES.map(s=>{const c=COL[s.key];
   return `<div class="scard" data-sense="${s.key}" style="background:${c.bg}">
     <div><div class="ci" style="color:${c.ink}">${s.title} · ${s.en}</div>
     <div class="ct" style="color:${c.ink}">${esc(s.sub)}</div>
     <div class="cs">${esc(s.tag)}</div></div>
     <span class="arw" style="color:${c.ink}">열어보기 ›</span></div>`;}).join('');
}
function prodCards(){
  return PRODUCTS.map((p,i)=>`<div class="pcard" data-prod="${i}">
    <div class="pn">${esc(p.name)}</div>
    <div class="pc">${esc(p.concept)}</div>
    <div class="pp">${SKEY.map(k=>`<span class="chip">${esc(p[k].t.split(' ')[0])}</span>`).join('')}</div></div>`).join('');
}
function openSense(key){
  const s=SENSES.find(x=>x.key===key);const c=COL[key];
  let h=`<div class="mhead" style="background:${c.bg};color:${c.ink}"><button class="mx" aria-label="닫기">×</button>
    <div class="mtag">${s.title} · ${s.en}</div><h2>${s.title} · ${esc(s.sub)}</h2><div class="mtagline">${esc(s.tag)}</div></div><div class="mbody">`;
  h+=`<div class="msec"><div class="mst" style="color:${c.ink}">① 일상의 단어</div><p class="mdesc">${esc(s.edesc)}</p>`;
  h+=s.groups.map(g=>`<div class="grp"><div class="gl" style="color:${c.ink}">${esc(g.label)}</div><div class="gw">${esc(g.words)}</div><div class="gr">→ ${esc(g.res)}</div></div>`).join('');
  h+=`</div>`;
  h+=`<div class="msec"><div class="mst" style="color:${c.ink}">② 향수 용어</div><p class="mdesc">${esc(s.tdesc)}</p>`;
  h+=`<div class="exq">예) &ldquo;${esc(s.ex)}&rdquo;</div>`;
  h+=`<div class="tgrid">`+s.terms.map(t=>`<div class="tcard"><div class="te" style="color:${c.ink}">${esc(t[0])}</div><div class="tk">${esc(t[1])}</div><div class="td">${esc(t[2])}</div></div>`).join('')+`</div></div>`;
  h+=`</div>`;
  show(h);
}
function openProd(i){
  const p=PRODUCTS[i];
  let h=`<div class="mhead" style="background:#f3efe9;color:#4a3f31"><button class="mx" aria-label="닫기">×</button>
    <div class="mtag">TAMBURINS 향의 언어</div><h2>${esc(p.name)}</h2><div class="mtagline">${esc(p.concept)}</div>
    <div class="notes">${esc(p.notes)}</div></div><div class="mbody">`;
  h+=SKEY.map(k=>{const s=SENSES.find(x=>x.key===k);const c=COL[k];const d=p[k];
    return `<div class="srow" style="border-color:${c.ink}"><div class="sl" style="color:${c.ink}">${s.title} · ${esc(s.sub)}</div><div class="sp">${esc(d.p)}</div><div class="ste">${esc(d.t)}</div></div>`;}).join('');
  h+=`<div class="scbox" style="background:#eef4e6;border:1px solid #d9e6c6"><div class="scl" style="color:#4a6b2e">쉬운 말 · EXPLORER · AESTHETE</div><div class="sct">${esc(p.easy)}</div></div>`;
  h+=`<div class="scbox" style="background:#eef1f8;border:1px solid #d4ddee"><div class="scl" style="color:#345">향수 용어 · SCENT LOVER · 향 고관여 고객</div><div class="sct">${esc(p.pro)}</div></div>`;
  if(p.foot)h+=`<div class="foot">${esc(p.foot)}</div>`;
  h+=`</div>`;
  show(h);
}
function show(h){const m=$('modal');m.innerHTML=h;$('ov').classList.add('on');document.body.style.overflow='hidden';m.querySelector('.mx').onclick=close;}
function close(){$('ov').classList.remove('on');document.body.style.overflow='';}
function boot(){
  $('sgrid').innerHTML=senseCards();$('pgrid').innerHTML=prodCards();
  document.querySelectorAll('[data-sense]').forEach(b=>b.onclick=()=>openSense(b.dataset.sense));
  document.querySelectorAll('[data-prod]').forEach(b=>b.onclick=()=>openProd(+b.dataset.prod));
  $('ov').onclick=e=>{if(e.target===$('ov'))close();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
}
boot();
</script>
